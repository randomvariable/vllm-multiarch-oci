schemaVersion: 2.0.0

metadataTest:
  # The image enters the launcher, not a shell and not the vLLM CLI directly. The
  # launcher publishes the checkpoint, resolves rank, waits for the leader,
  # validates the cache, then execs vLLM as the container's PID 1. A command that
  # is not a launcher option still reaches the vLLM CLI unchanged.
  entrypoint: ["/opt/python/bin/python", "-m", "image_tools.vllm_image", "entrypoint"]
  workdir: "/root"
  labels:
    - key: "org.opencontainers.image.source"
      value: "https://github.com/local-inference-lab/vllm"
    - key: "org.opencontainers.image.revision"
      value: "[0-9a-f]{40}"
      isRegex: true
    - key: "org.opencontainers.image.version"
      # Upstream vLLM base version, the cycle the source ref names, the pinned
      # vLLM and B12X commits, and the digest over the locked source set. The
      # cycle carries its PEP 440 spelling, which is what the wheel filename
      # and metadata carry too.
      value: "[0-9]+\\.[0-9]+\\.[0-9]+\\+[a-z0-9]+(\\.[a-z0-9]+)*(\\.[0-9a-f]{12}){3}"
      isRegex: true
    - key: "uk.co.randomvariable.vllmb12x.vllm-source-ref"
      value: "(refs/heads/.+|[0-9a-f]{40})"
      isRegex: true
    - key: "uk.co.randomvariable.vllmb12x.builder-source"
      value: "https://github.com/randomvariable/vllm-multiarch-oci"
  envVars:
    - key: "CUDA_HOME"
      value: "/usr/local/cuda"
    # The entrypoint names the hermetic interpreter, so the mounted wheel tree has
    # to be on its import path from the image configuration.
    - key: "PYTHONPATH"
      value: "/opt/venv/lib/python3.12/site-packages"
    - key: "PATH"
      value: "/opt/venv/bin:/usr/local/nvidia/bin:/usr/local/cuda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

fileExistenceTests:
  - name: "hermetic Python launcher"
    path: "/opt/venv/bin/python"
    shouldExist: true
    permissions: "-rwxr-xr-x"
  - name: "vLLM launcher"
    path: "/opt/venv/bin/vllm"
    shouldExist: true
    permissions: "-rwxr-xr-x"
  - name: "Mooncake command wrappers"
    path: "/opt/venv/bin/mooncake_master"
    shouldExist: true
    permissions: "-rwxr-xr-x"
  - name: "Mooncake client wrapper"
    path: "/opt/venv/bin/mooncake_client"
    shouldExist: true
    permissions: "-rwxr-xr-x"
  - name: "Mooncake transfer benchmark wrapper"
    path: "/opt/venv/bin/transfer_engine_bench"
    shouldExist: true
    permissions: "-rwxr-xr-x"
  - name: "Mooncake metadata server wrapper"
    path: "/opt/venv/bin/mooncake_http_metadata_server"
    shouldExist: true
    permissions: "-rwxr-xr-x"
  - name: "Mooncake Store REST server wrapper"
    path: "/opt/venv/bin/mc_store_rest_server"
    shouldExist: true
    permissions: "-rwxr-xr-x"
  - name: "Mooncake topology dump wrapper"
    path: "/opt/venv/bin/transfer_engine_topology_dump"
    shouldExist: true
    permissions: "-rwxr-xr-x"
  - name: "Kubernetes image helper"
    path: "/opt/venv/bin/vllm-image"
    shouldExist: true
    permissions: "-rwxr-xr-x"
  - name: "vLLM wheel package"
    path: "/opt/venv/lib/python3.12/site-packages/vllm/__init__.py"
    shouldExist: true
  - name: "profile-pinned NCCL"
    path: "/opt/nccl/lib/libnccl.so.2.30.4"
    shouldExist: true
  - name: "CUDA 13 cuSPARSELt runtime"
    path: "/opt/cusparselt/lib/libcusparseLt.so.0"
    shouldExist: true
  - name: "B12X build provenance lock"
    path: "/opt/vllmb12x/sources.lock.json"
    shouldExist: true
  - name: "B12X source identities"
    path: "/opt/vllmb12x/source-identity/vllm.json"
    shouldExist: true
  # b12x compiles its PLE reader in the container and only enables the
  # io_uring path when pkg-config reports liburing, so the headers and
  # pkg-config are runtime dependencies rather than build-only ones.
  - name: "liburing development headers"
    path: "/usr/include/liburing.h"
    shouldExist: true
  - name: "pkg-config"
    path: "/usr/bin/pkg-config"
    shouldExist: true
  - name: "RDMA verbs development headers"
    path: "/usr/include/infiniband/verbs.h"
    shouldExist: true
  - name: "Named non-root account home"
    path: "/home/vllm"
    shouldExist: true
    permissions: "drwxr-xr-x"
  # The launcher, its policy data and the probe endpoints are what replace the
  # inline shell that used to live in the deployment manifests.
  - name: "Launcher package"
    path: "/opt/venv/lib/python3.12/site-packages/image_tools/launcher/launch.py"
    shouldExist: true
  - name: "Probe endpoints"
    path: "/opt/venv/lib/python3.12/site-packages/image_tools/launcher/probes.py"
    shouldExist: true
  - name: "Cache runtime"
    path: "/opt/venv/lib/python3.12/site-packages/image_tools/launcher/cache_runtime.py"
    shouldExist: true
  - name: "Replica proxy"
    path: "/opt/venv/lib/python3.12/site-packages/image_tools/launcher/proxy.py"
    shouldExist: true
  - name: "Policy data"
    path: "/opt/vllm-image/runtime/options.yaml"
    shouldExist: true
  - name: "GB10 hardware profile"
    path: "/opt/vllm-image/runtime/hardware/gb10-roce.yaml"
    shouldExist: true
  - name: "Qwen GB10 recipe"
    path: "/opt/vllm-image/recipes/qwen38-flash-next-gb10-tp2.yaml"
    shouldExist: true

# Ubuntu resolves accounts through these files, so the named account has to
# appear in both.
fileContentTests:
  - name: "Named non-root account is in passwd"
    path: "/etc/passwd"
    expectedContents: ["vllm:x:10001:10001:[^:]*:/home/vllm:/bin/bash"]
  - name: "Named non-root account is in group"
    path: "/etc/group"
    expectedContents: ["vllm:x:10001:"]

commandTests:
  - name: "Generic image helper exposes stable commands"
    command: "/opt/venv/bin/vllm-image"
    args: ["--help"]
    expectedOutput: ["rendezvous-wait,model-sync,health,launch,entrypoint,probe"]
  # Nothing in the launch path may be a shell script: a shell at PID 1 owns the
  # process the runtime signals and hides the engine's real exit status, and a
  # wheel console script that wraps `exec /opt/venv/bin/python -c` does the same.
  - name: "Launch path executables are Python"
    command: "/opt/venv/bin/python"
    args:
      - "-c"
      - "from pathlib import Path; expected = '#!/opt/python/bin/python'; offenders = {name: Path(name).read_text(errors='ignore').splitlines()[0] for name in ('/opt/venv/bin/vllm-image', '/opt/venv/bin/lmcache') if not Path(name).read_text(errors='ignore').startswith(expected + chr(10))}; assert not offenders, offenders; print('launch path is python')"
    expectedOutput: ["launch path is python"]
  # The recipe is a two-rank LeaderWorkerSet, so the launcher refuses to resolve it
  # without the rank variables the controller injects; the test supplies rank zero
  # the way a leader pod would see it.
  - name: "Recipe resolution needs no GPU and no download"
    command: "/opt/venv/bin/vllm-image"
    args: ["launch", "--recipe", "qwen38-flash-next-gb10-tp2", "--print-config"]
    envVars:
      - key: "LWS_WORKER_INDEX"
        value: "0"
      - key: "LWS_GROUP_SIZE"
        value: "2"
      - key: "LWS_LEADER_ADDRESS"
        value: "qwen38-flash-next-0.qwen38-flash-next"
      - key: "POD_IP"
        value: "192.0.2.10"
    expectedOutput: ["\"argv\":", "vllm.entrypoints.cli.main", "--moe-backend", "b12x"]
  # Torch links cuDNN, cuBLAS, cuSPARSELt and NCCL, so a successful import is
  # the only proof that every runtime layer resolves through the loader.
  - name: "Torch resolves its CUDA runtime"
    command: "/opt/venv/bin/python"
    args:
      - "-c"
      - "import torch; print('cudnn', torch.backends.cudnn.version())"
    expectedOutput: ["cudnn 9[0-9]+"]
  - name: "Python runs with mimalloc preloaded"
    command: "/opt/venv/bin/python"
    args:
      - "-c"
      - "from pathlib import Path; assert 'libmimalloc.so.3' in Path('/proc/self/maps').read_text(); print('mimalloc preloaded')"
    expectedOutput: ["mimalloc preloaded"]
  - name: "vLLM CLI starts with mimalloc preloaded"
    command: "/opt/venv/bin/vllm"
    envVars:
      - key: "VLLM_TARGET_DEVICE"
        value: "cpu"
    args: ["--help"]
    expectedOutput: ["vLLM CLI"]
  - name: "Mooncake Python modules and CLI entry points are installed"
    command: "/opt/venv/bin/python"
    args:
      - "-c"
      - "from importlib.metadata import distribution; import mooncake; package = distribution('mooncake-transfer-engine-cuda13'); expected = {'mooncake_master', 'mooncake_client', 'transfer_engine_bench', 'mooncake_http_metadata_server', 'mc_store_rest_server', 'transfer_engine_topology_dump'}; actual = {entry.name for entry in package.entry_points if entry.group == 'console_scripts'}; assert actual == expected, actual; assert package.version == '0.3.13.post1', package.version; print('Mooncake modules and CLI entry points installed')"
    expectedOutput: ["Mooncake modules and CLI entry points installed"]
  - name: "B12X source lock identifies the selected vLLM revision"
    command: "/opt/venv/bin/python"
    args:
      - "-c"
      - "import json; lock = json.load(open('/opt/vllmb12x/sources.lock.json')); assert lock['profile']['name'] == 'vllmb12x'; print(lock['profile']['sources']['vllm']['commit'])"
    expectedOutput: ["[0-9a-f]{40}"]
  - name: "pkg-config resolves liburing"
    command: "/usr/bin/pkg-config"
    args: ["--modversion", "liburing"]
    expectedOutput: ["[0-9]+\\.[0-9]+"]
  # The compiled loader must link liburing. Without it DiskTable raises
  # "io_uring PLE support is unavailable" on the first forward pass, which
  # only surfaces after a full checkpoint download.
  - name: "B12X loader links io_uring"
    command: "/opt/venv/bin/python"
    args:
      - "-c"
      - "from b12x.loader import _native; module = _native._build(); assert b'liburing' in module.read_bytes(), module; print('io_uring linked')"
    expectedOutput: ["io_uring linked"]
  # nvidia-cutlass-dsl publishes its package root through a .pth file, which
  # only runs because the venv layer ships sitecustomize.py.
  - name: "CUTLASS DSL is importable"
    command: "/opt/venv/bin/python"
    args: ["-c", "import cutlass; print('cutlass', cutlass.__file__)"]
    expectedOutput: ["cutlass /"]
  # VLLM_USE_FASTOKENS=1 makes vLLM patch transformers through fastokens at
  # tokenizer load and raise ImportError when the package is absent or older
  # than vLLM's minimum, so run vLLM's own patch entry point.
  - name: "vLLM fastokens tokenizer backend applies"
    command: "/opt/venv/bin/python"
    args:
      - "-c"
      - "from vllm.tokenizers.fastokens import apply_fastokens_patch; from importlib.metadata import version; apply_fastokens_patch(); print('fastokens', version('fastokens'))"
    expectedOutput: ["fastokens 0\\.3\\.2"]
  # b12x preparation compiles C++ shims in the container at first use; torch
  # cpp_extension requires the ninja binary, which pip --target installs of
  # the ninja wheel omit unless the venv layer materializes them.
  - name: "ninja binary available for runtime JIT"
    command: "/opt/venv/bin/ninja"
    args: ["--version"]
    expectedOutput: ["1\\.[0-9]+"]
  - name: "B12X Lightning Indexer CuteDSL imports"
    command: "/opt/venv/bin/python"
    args:
      - "-c"
      - "from vllm.vllm_flash_attn.cute.cache_utils import get_jit_cache; import vllm.models.deepseek_v4.nvidia.ops.fused_indexer_q_cutedsl; print('B12X Lightning Indexer CuteDSL import OK')"
    expectedOutput: ["B12X Lightning Indexer CuteDSL import OK"]
  # b12x builds its RoCE proxy at channel construction, after
  # roce.is_supported() has already returned True, so a missing
  # infiniband/verbs.h silently demotes RoCEnante to NCCL at model load.
  - name: "B12X RoCE proxy compiles"
    command: "/opt/venv/bin/python"
    args:
      - "-c"
      - "from b12x.comm.roce import _proxy; print('roce proxy', _proxy._build().name)"
    expectedOutput: ["roce proxy roce_proxy-[0-9a-f]+\\.so"]
  # A pod that pins its own runAsUser previously had no passwd entry, so
  # expanduser("~") resolved to "/" and imports that create a workspace below
  # the home directory failed. Drop to the named account and prove the home
  # directory resolves and is writable.
  #
  # HOME is cleared deliberately: CST runs this container as the image's
  # default user, where the runtime does export HOME=/root, and setpriv would
  # inherit it. A pod that pins runAsUser is not given that variable, so
  # leaving it set would test the runtime's root environment instead of the
  # account, and fail on a correct image.
  - name: "Non-root account resolves and can write its home directory"
    command: "/usr/bin/setpriv"
    args:
      - "--reuid"
      - "10001"
      - "--regid"
      - "10001"
      - "--clear-groups"
      - "/usr/bin/env"
      - "-u"
      - "HOME"
      - "/opt/venv/bin/python"
      - "-c"
      - "import os, pathlib; home = pathlib.Path(os.path.expanduser('~')); workspace = home / 'workspace'; workspace.mkdir(parents=True, exist_ok=True); (workspace / 'ok').write_text('ok'); print('uid', os.getuid(), 'home', home)"
    expectedOutput: ["uid 10001 home /home/vllm"]
