# Qwen3.8 Flash Next NVFP4 on two RoCE-joined GB10 nodes, TP=2.
#
# Selection: the upstream qwen38-flash-next model profile plus our gb10-roce
# hardware profile. Everything the model profile or the common layer already
# sets is left out of this file on purpose -- see the per-value comments. Only
# the values this image's accepted live deployment actually changed relative to
# upstream policy, and the process settings that are ours rather than
# upstream's, are listed here.
#
# Source of truth for every value below:
#   recipes/local-inference-lab/Qwen3.8-Flash-Next-NVFP4.yaml (accepted
#   engine arguments and environment) and the live manifest
#   internal.randomvariable.co.uk src/rv/k8s/clusters/home/llm-d/
#   qwen38-flash-next.yaml lines 333-645 (rank branch, KV topic, environment).
#
# Unmanaged native arguments that this deployment also passes after `--` are
# recorded at the bottom of this file: runtime/options.yaml does not describe
# them, so the resolver cannot accept them as recipe options and forwards them
# to vLLM verbatim.
launch:
  profile: qwen38-flash-next
  hardware: gb10-roce
  # No preset. upstream's qwen38-tp2 preset raises tensor-parallel-size to 2
  # but is qualified against rtx-pro-6000-pcie, where that pair of GPUs sits in
  # one host and shares a PCIe crossover all-reduce. Here the second GPU is on
  # another node behind RoCE, so the parallelism degree belongs to this recipe,
  # not to a preset that describes different silicon.
  preset: null
  options:
    # The launcher publishes the fetched snapshot here; the engine loads a
    # directory of safetensors on local NVMe, never the repository id. In
    # ple_table_memory=ram the PLE table is copied from these files once at
    # boot into page-locked host memory, so the published root must stay local
    # and readable for load and restart rather than for every forward pass.
    model: /models/qwen38-flash-next
    # The profile serves the checkpoint's own name; this deployment answers to
    # the short name the gateway and the LiteLLM modelRef use, and the KV-event
    # topic embeds it, so a mismatch silently reads zero prefix hits.
    served-model-name: qwen38-flash-next
    # Single source of truth for the serving port: it also appears in the
    # KV-event topic, which the router matches against the endpoint
    # address:port it learned from the InferencePool.
    port: 8888
    # One GPU per node across two nodes. The profile is a single-node RTX PRO
    # policy and leaves this at 1; 2 matches LWS_GROUP_SIZE in the live
    # manifest, which is where the accepted command got it.
    tensor-parallel-size: 2
    # 16, not the profile's 64: the accepted GDN/recurrent checkpoint blocking
    # for this checkpoint on GB10.
    block-size: 16
    # The checkpoint advertises 262144 positions with rope_type "default". The
    # resolver derives the 4x YaRN --hf-overrides from this number, including
    # mrope_section and mrope_interleaved, which get_rope() needs present to
    # preserve M-RoPE for the vision position ids. Set the context here and
    # nothing rope-related: a hand-written hf-overrides would bypass that
    # derivation. VLLM_ALLOW_LONG_MAX_MODEL_LEN stays unset exactly as the
    # accepted recipe argues: the profile's own context ceiling is the
    # authority on what this image may be asked to admit.
    max-model-len: 1048576
    max-num-seqs: 8
    max-num-batched-tokens: 8192
    # 32, not the profile's 64: two GB10 hosts froze during the startup profile
    # pass at the wider capture ceiling; 32 is the accepted cap at this
    # checkpoint and utilization.
    max-cudagraph-capture-size: 32
    # 0.74, not 0.76: the step-5500 checkpoint loads 42.77 GiB per rank against
    # 40.32 GiB at step 4000 (MXFP4 MTP experts), and at 0.76 the startup
    # profile pass froze two GB10 hosts with no kernel log. 0.74 gives back
    # 2.48 GiB of the 123.79 GiB budget. Not the profile's 0.96 either, which
    # is a single-node RTX PRO figure with no second rank to share the host.
    gpu-memory-utilization: 0.74
    # No speculative-config, mode or draft-tokens here: the profile's mtp mode
    # supplies the MTP policy, which adds draft_sample_method,
    # rejection_sample_method and moe_backend to the hand-written command's
    # {"method":"mtp","num_speculative_tokens":3}. Adopting those is the point
    # of this file.
    recurrent-checkpoint-policy: aligned
    # Decode-aware prefill scheduling: the scheduler admits prefills against
    # decode pressure with an adaptive share and half-life. Live manifest flags
    # as of the 2026-09-30 step-5500 acceptance.
    max-parallel-prefills: auto
    prefill-compute-share: auto
    prefill-compute-half-life: responsive
    prefill-policy: decode-aware
    limit-mm-per-prompt:
      image: 1
      video: 1
    # ram copies the PLE n-gram tables into page-locked host memory at boot
    # (13.41 GiB per rank) instead of reading them through the io_uring
    # DiskTable on every forward pass. disk mode retired on 2026-09-22: the
    # recurring async illegal-memory-access class surfaced through its
    # synchronize point; ram is the mode accepted by live soak.
    additional-config:
      ple_table_memory: ram
  environment:
    # Not repeated here because another layer already sets them, and this file
    # must stay a delta: CUDA_DEVICE_ORDER, HF_HOME's replacement below
    # aside -- the common layer sets CUDA_DEVICE_ORDER, SAFETENSORS_FAST_GPU,
    # PYTORCH_CUDA_ALLOC_CONF, INSTANTTENSOR_BACKEND, VLLM_USE_V2_MODEL_RUNNER
    # and VLLM_WORKER_MULTIPROC_METHOD; the model profile sets
    # VLLM_SSM_CONV_STATE_LAYOUT=DS, OMP_NUM_THREADS=2 and the B12X dynamic
    # MoE/LM-head set; gb10-roce sets the NCCL, RoCE, spin-limit, PCIe-off and
    # architecture list.
    #
    # nvidia-cutlass-dsl's .pth does not take effect in this image's venv and
    # RoCEnante needs it: see docs.PYTHONPATH.
    PYTHONPATH: /opt/venv/lib/python3.12/site-packages:/opt/venv/lib/python3.12/site-packages/nvidia_cutlass_dsl/dsl_packages
    # instanttensor is a stock vLLM loader, so this recipe needs no b12x
    # plugin; the live deployment leaves the allowlist empty. Set it to
    # b12x_loader only if you switch --load-format to b12x.
    VLLM_PLUGINS: ""
    # The checkpoint is fetched and published by the launcher before the engine
    # starts, so nothing here may reach the hub: see docs.HF_HUB_OFFLINE.
    HF_HOME: /models
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    INSTANTTENSOR_BUFFER_SIZE: "1342177280"
    INSTANTTENSOR_CONCURRENCY: "1"
    INSTANTTENSOR_IO_DEPTH: "3"
    # The model profile leaves the dense activation mode on auto; a16 dense
    # plus quantized MXFP8 is the accepted pair for this checkpoint, measured
    # on the live ranks.
    VLLM_B12X_DENSE_ACTIVATION_MODE: a16
    VLLM_B12X_MXFP8_ACTIVATION_MODE: quantized
    VLLM_EXPERIMENTAL_SHM_BROADCAST_ADAPTIVE_SPIN: "1"
    VLLM_SHM_BROADCAST_ADAPTIVE_MAX_GRACE_MS: "50"
    CUDA_ENABLE_COREDUMP_ON_EXCEPTION: "1"
    CUDA_COREDUMP_FILE: /cache/ima-debug/core.%h.%p.%t.nvcudmp
    CUDA_COREDUMP_GENERATION_FLAGS: faulted_contexts_only,gzip_compress
    VLLM_MARLIN_USE_ATOMIC_ADD: "1"
    # Node-local compiler/JIT scratch on persistent NVMe, kept off overlayfs:
    # TP=2 JIT on overlayfs stalled the NCCL watchdog on sibling workloads. The
    # remaining compiler-cache paths the resolver derives from XDG_CACHE_HOME
    # land on the same volume; these are spelled out because they are the
    # accepted live values.
    VLLM_CACHE_ROOT: /cache/vllm
    XDG_CACHE_HOME: /cache
    TRITON_CACHE_DIR: /cache/triton
    TORCHINDUCTOR_CACHE_DIR: /cache/torchinductor
    FLASHINFER_WORKSPACE_BASE: /cache/flashinfer
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
    # Precompiled AOT artifacts ship in the image; without these the ranks JIT
    # the whole compilation set on every boot.
    VLLM_USE_AOT_COMPILE: "1"
    VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  model_sync:
    repo: local-inference-lab/Qwen3.8-Flash-Next-NVFP4
    # Last working checkpoint, pinned independently of the runtime image. A
    # full 40-hex commit OID: a branch or tag would let a moved ref change a
    # deployment under a fixed digest.
    revision: 60215d26cf5e42c2db6128774032d57fc62678da
    storage_root: /models
    publish: /models/qwen38-flash-next
    # The checkpoint's tensor payload is about 99 GiB. Refuse to start a
    # download that cannot finish rather than filling the node's NVMe and
    # taking unrelated models down with it.
    min_free_gib: 130
    workers: 8
    # Every file in the snapshot is needed: unlike the DeepSeek checkpoint this
    # repository carries no inference/, encoding/ or .eval_results/ trees.
    ignore_patterns: []
    # Loaded after the weights. Naming them lets the image helper fail on a
    # truncated snapshot instead of the engine failing at model load.
    required_files:
      - tokenizer_config.json
      - chat_template.jinja
  topology:
    kind: lws
    nodes: 2
    # The rank-zero rendezvous socket the follower polls before exec'ing. Also
    # the --master-port the engine is given.
    rendezvous_port: 25000
    kv_events:
      # Rank zero only. The leader owns the API server and the EngineCore
      # scheduler, so it is the only rank that can serve /v1/messages/render or
      # publish KV events; rank one runs --headless, and publishing from it
      # would add a second, unroutable source for the same blocks. The topic is
      # built from POD_IP, the resolved --port and the resolved
      # --served-model-name by launch.kv_events_args. Publisher ports are
      # offset by data-parallel rank (DP=1 here, so 5556/5559 are literal),
      # chosen off vLLM's 5557 default; buffer_steps/hwm/max_queue_size stay at
      # engine defaults.
      publisher: zmq
      endpoint: tcp://*:5556
      replay_endpoint: tcp://*:5559
    # Not a replica layout: one conversation spans both ranks, so there is no
    # per-replica port range.
    replica_port_base: null
  # The probe sidecar listens here on every rank, including the headless ones,
  # which have no HTTP server of their own.
  probe_port: 8890

# Unmanaged native arguments this deployment passes after `--`. They are not in
# runtime/options.yaml, so the resolver forwards them to vLLM without
# validating them; a recipe cannot carry them as options.
#   --distributed-executor-backend mp
#   --master-port 25000
#   --gdn-prefill-backend b12x
#   --disable-access-log-for-endpoints /metrics,/v1/models

# Per-value explanation for the site's step 3, read alongside upstream's
# runtime/parameter-docs.yaml. Only the names upstream does not document appear
# here, and each documents a value this file itself sets.
docs:
  PYTHONPATH:
    group: runtime
    summary: sys.path entries the engine's children inherit, the venv plus the CuTe DSL packages.
    why: >-
      nvidia-cutlass-dsl 4.6.2 ships nvidia_cutlass_dsl_packages.pth to put its
      dsl_packages directory, which holds the cutlass package, on sys.path, and
      that .pth does not take effect in this image's venv: import cutlass fails
      even though the files are present. It is b12x.comm.roce.is_supported()
      that needs cutlass, and B12xRoceAllReduce._local_capability calls it
      outside its ImportError guard, so without this variable
      VLLM_ENABLE_ROCE_ALLREDUCE=1 raises during distributed init instead of
      voting RoCEnante off. Both entries are required: /opt/venv/bin/python
      prepends the venv's site-packages for its own children, but a PYTHONPATH
      carrying only dsl_packages hides the venv.
  HF_HUB_OFFLINE:
    group: model
    summary: Refuse any hub request; the checkpoint is already on the node.
    why: >-
      The launcher's model-sync phase fetches, verifies and publishes the
      snapshot before the engine starts, so a request out to huggingface.co at
      load time would mean the published root was not used. The same reason
      gives TRANSFORMERS_OFFLINE its value.
  TRANSFORMERS_OFFLINE:
    group: model
    summary: Refuse any hub request from the tokenizer and processor loaders.
    why: >-
      transformers resolves tokenizer and chat-template assets independently of
      vLLM's model fetch, so offline must be asserted on both paths: the
      required_files list names them precisely so a truncated snapshot fails in
      the launcher rather than at model load.
  INSTANTTENSOR_BUFFER_SIZE:
    group: runtime
    summary: Size of one InstantTensor read buffer, 1.25 GiB.
    why: >-
      Direct GPU reads for the 99 GiB tensor payload, sized so one buffered read
      covers a shard's worth of weights without pinning the whole file.
  INSTANTTENSOR_CONCURRENCY:
    group: runtime
    summary: Concurrent InstantTensor read streams.
    why: >-
      One stream at a time keeps the node's NVMe queue depth shared with the
      PLE table's boot copy instead of competing with it.
  INSTANTTENSOR_IO_DEPTH:
    group: runtime
    summary: Outstanding I/O requests per InstantTensor stream.
    why: >-
      Three deep is the accepted pairing with a single stream on the node-local
      NVMe of a GB10 host.
  VLLM_B12X_MXFP8_ACTIVATION_MODE:
    group: kernels
    summary: Quantized activations for the B12X MXFP8 layers.
    why: >-
      The live deployment quantizes the B12X MXFP8 activations; a16 dense plus
      quantized MXFP8 is the accepted pair for this checkpoint. The rank-0 boot
      log is the evidence: B12X for the NVFP4 target experts, B12X_MXFP8 for the
      MTP draft experts at their unpadded 320-wide TP=2 intermediate.
  VLLM_EXPERIMENTAL_SHM_BROADCAST_ADAPTIVE_SPIN:
    group: kernels
    summary: Opt in to adaptive waits in vLLM's shared-memory broadcast.
    why: >-
      Readers otherwise spin on sched_yield(), which keeps every TP rank's
      threads runnable on GB10 and starves anything else in the container's CPU
      group -- including a kubelet exec probe, which is why liveness left the
      modelserver container.
  VLLM_SHM_BROADCAST_ADAPTIVE_MAX_GRACE_MS:
    group: kernels
    summary: Ceiling on one adaptive shared-memory broadcast wait, in milliseconds.
    why: >-
      A 900 ms maximum grace deadlocked one group in B12X preparation on first
      boot; 50 ms booted both. Reader grace is clamp(BUDGET^2 / T_ema,
      MIN_GRACE, MAX_GRACE), so the 50 ms ceiling is only approached under
      sub-microsecond read cadence and idle readers still park within MIN_GRACE.
  CUDA_ENABLE_COREDUMP_ON_EXCEPTION:
    group: kernels
    summary: Ask the CUDA driver for a core dump when a kernel faults.
    why: >-
      Capture the faulting GPU context without attaching a debugger to a live TP
      worker: the QSA illegal-memory-access class is open on this checkpoint.
  CUDA_COREDUMP_FILE:
    group: kernels
    summary: Path template for the faulting-context core dumps.
    why: >-
      Written to /cache, which is node-local persistent NVMe, so the dump
      survives the pod that produced it and can be read after the group is
      recreated.
  CUDA_COREDUMP_GENERATION_FLAGS:
    group: kernels
    summary: Dump only the faulted contexts, compressed.
    why: >-
      faulted_contexts_only and gzip_compress keep a dump on a four-GPU host
      small enough to be worth keeping; a full-context dump of a rank under a
      123 GiB budget is not.
  VLLM_MARLIN_USE_ATOMIC_ADD:
    group: kernels
    summary: Marlin's atomic-add reduction path for quantized GEMMs.
    why: >-
      Marlin is the fallback for some quantized shapes on this checkpoint, and
      the accepted ranks log it; the atomic-add path is the one that was
      measured under load.
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS:
    group: runtime
    summary: Watchdog budget for one execute_model step, in seconds.
    why: >-
      A 1,048,576-token prefill on two GB10 ranks exceeds the engine's own
      window, and the timeout kills an engine that is still making progress.
