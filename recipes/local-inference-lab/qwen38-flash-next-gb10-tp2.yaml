guide:
  hardware: Two arm64 GB10 nodes, one physical integrated GPU per node, with a working RoCE secondary network and at least 130 GiB free model storage per node for the 99 GiB checkpoint.
  fixed_tuning: TP=2, MTP depth 3, 0.74 GPU memory utilization, 1,048,576-token maximum context from a 4x YaRN override, eight sequences, 8,192 batched tokens, decode-aware prefill scheduling, FP8 KV cache, full and piecewise CUDA graphs capped at a 32-token capture size, B12X GDN prefill and decode, quantized B12X MXFP8 activations, NVFP4 target experts and MXFP8 MTP draft experts both on B12X kernels, PLE tables in page-locked host memory, and KV-event publishing from rank zero only. Never set CUDA_LAUNCH_BLOCKING, because b12x does not function with synchronous kernel launches.
  networking: Primary control traffic uses the operator-selected socket interfaces; tensor-parallel collectives use the selected RDMA HCAs. Kubernetes allocator units do not describe physical device counts.
  safety: Stop both ranks gracefully with a 120-second timeout. A long kernel is not grounds for force-killing a GB10 process.
