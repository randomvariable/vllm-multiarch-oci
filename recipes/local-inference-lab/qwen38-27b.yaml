  notes:
    - title: Method
      body: >-
        The decode and boot figures are DCGM samples read against the engine's own
        logs on 2026-09-22, not a benchmark-harness run (qwen38-27b.yaml:269-280,
        318-330). The device is an RTX PRO 6000 Blackwell Max-Q power-capped at
        300 W, which is what makes the three-stream collapse a power effect rather
        than a scheduler one.
    - title: Conditions
      body: >-
        The memory panel is the 2026-09-20 boot of engine
        v0.1.dev1+gf6281c7ba on sm_120 (qwen38-27b.yaml:31-40). The GPU budget the
        recipe now serves -- 0.92 utilization on the QAD checkpoint -- was
        re-measured later on the same host, and that run's footprint is the
        Capacity note below.
    - title: Scheduler
      body: >-
        The recipe adopts the batch-size-keyed schedule rather than static MTP-3:
        full MTP-3 for one or two concurrent streams, speculation disabled at three
        or more, so every step then yields one token per stream. The roughly 40
        tok/s aggregate the disabled-speculation path is expected to hold at three
        or more streams is a projection from the single-stream rate, not a measured
        cell. Acceptance-length adaptation
        (adaptive_speculative_tokens_*) is deliberately unset: acceptance is
        already high, and the batch-size schedule expresses the policy without
        per-request tuning noise (qwen38-27b.yaml:269-280).
    - title: Capacity
      body: >-
        Measured footprint on this deployment is 35,673 bytes per token -- 61.99
        GiB for 1,865,871 tokens. So 32 sequences at 128k need 139 GiB and would
        overrun the 62 GiB GPU cache into preemption, while 32 at 32k need 35 GiB
        and fit; only about 1.8 full-context sequences fit in the GPU cache, and 8
        with the node's RAM added, so 32 concurrent full-context requests is not
        reachable by offload alone (qwen38-27b.yaml:64-73).
    - title: Not measured
      body: >-
        No time-to-first-token or end-to-end distribution, no prefix-cache reuse
        through a router, no gateway-path overhead and no concurrency figure for
        the adopted batch-size schedule: the three-stream row above is the static
        baseline that schedule replaced. The boot never reached a CuTe DSL launch
        on this checkpoint -- it chose the Triton/FLA GDN prefill kernel, the CUDA
        GDN decode kernel and Marlin for MXFP8 -- so the sm_120a DSL architecture
        override this recipe carries is unconfirmed by measurement
        (qwen38-27b.yaml:132-136).
validation:
  # No `image` key: nothing here claims `verified`, so there is no accepted public
  # digest to name. The build these observations come from is vllm-b12x-multi
  # PR-28 -- the multi-arch index 6ae39189d82f whose linux/arm64 leaf is
  # 6529f31fa482, carrying vLLM 588bc2641de6 and B12X 2b1a2358b9f0
  # (qwen38-27b.yaml:126-141) -- and that publication never reached a public
  # registry. Naming a digest here would name a build that was not the accepted
  # one, which is the failure this field exists to prevent.
  kubernetes: unverified
  docker: unverified
  evidence: >-
    Ran live as a single-replica Kubernetes Deployment on one RTX PRO 6000
    Blackwell Max-Q host, and recorded unverified because the build it was
    accepted on -- vLLM 588bc2641de6 with B12X 2b1a2358b9f0 -- shipped only as a
    pull-request artifact and no public registry carries it, so this recipe cannot
    point a reader at the image that produced these observations. The
    observations themselves are recorded: the pinned build boots this checkpoint
    with no prologue patch, the GDN warmup runs and the engine reaches Application
    startup complete (qwen38-27b.yaml:154-169); the 2026-09-20 boot measured 21.79
    GiB of weights, 2.33 GiB of peak activation, 0.12 GiB of CUDA graphs and 61.32
    GiB of available KV cache holding 1,845,556 fp8 tokens, which fits one
    full-window request 1.76 times concurrently (lines 31-40); the batch-size-keyed
    MTP schedule is from the 2026-09-22 DCGM and engine-log run (lines 269-280);
    and a warm b12x compile cache turned a 172.09 s boot into a 60.74 s one
    (lines 318-330). Docker is unverified: the live definition is Kubernetes-only
    and the same arguments have not been run under docker run on a single host.
guide:
  hardware: >-
    One host with a single RTX PRO 6000 Blackwell Max-Q GPU (sm_120). The device plugin reports four nvidia.com/gpu only because it is configured with timeSlicing.replicas: 4, so request exactly one and never a CUDA_VISIBLE_DEVICES list naming a second index, which would name a device that does not exist (qwen38-27b.yaml:379-393). The container asks for 8 CPUs and 48Gi with a 72Gi memory limit and 8Gi of ephemeral storage, and /dev/shm is capped at 64Gi of tmpfs that counts against that memory limit (lines 385-393, 429-434). The model hostPath needs room for the 21.16 GiB checkpoint and the roughly 31.6 GB the first start downloads before the engine loads (lines 9-14, 394-395); the JIT hostPath holds the triton, inductor, flashinfer, xet and b12x compile caches, and a warm b12x cache is the difference between a 60.74 s boot and a 172.09 s one (lines 318-330).
  fixed_tuning: TP=1 on one GPU, MTP at depth 3 on a batch-size-keyed schedule that keeps full MTP-3 for one or two concurrent streams and disables speculation at three or more, 0.92 GPU memory utilization, a 1,048,576-token maximum context from a static factor-4 YaRN override written out rather than derived, 32 sequences, 8,192 batched tokens, a 128-token CUDA graph capture cap derived from the sequence cap times the speculative width, FP8 KV cache, prefix caching with a 16-token match unit and mamba cache mode align, eight images per prompt, both FlashInfer MXFP8 linear kernels excluded for the fused 96-wide GDN in_proj_ba, b12x as the linear backend through --kernel-config, and the Python API frontend rather than vllm-rs.
  networking: No secondary network. One node and one rank means there is no cross-host collective to carry, no RDMA resource to allocate and no leader address to rendezvous with; the single container is reached through its own Service.
  safety: Stop the container gracefully with a 120-second timeout, as the live definition sets (qwen38-27b.yaml:120). A first start downloads the checkpoint and then compiles and captures graphs, which the 60-minute startup budget covers (lines 394-401); do not shorten that budget, and never set CUDA_LAUNCH_BLOCKING, because b12x does not function with synchronous kernel launches.
