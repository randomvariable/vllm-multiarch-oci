meta:
  title: Qwen3.8 Flash Next NVFP4, two-node TP=2
  slug: qwen38-flash-next-tp2
  description: A fixed two-node, one-GB10-per-node Qwen3.8-Flash-Next-NVFP4 deployment with PLE tables in page-locked host memory and a 1,048,576-token context.
model:
  model_id: local-inference-lab/Qwen3.8-Flash-Next-NVFP4
  revision: 629bc3218833a38b475b719f34aa571666f4a03e
  served_name: qwen38-flash-next
runtime:
  command:
    - /opt/venv/bin/python
    - -m
    - vllm.entrypoints.cli.main
    - serve
  base_args:
    - --served-model-name
    - qwen38-flash-next
    - --host
    - 0.0.0.0
    - --port
    - "8888"
    - --pipeline-parallel-size
    - "1"
    - --distributed-executor-backend
    - mp
    - --master-port
    - "25000"
    - --mm-encoder-tp-mode
    - data
    - --mm-processor-cache-gb
    - "0"
    - --limit-mm-per-prompt
    - '{"image":1,"video":1}'
    - --mamba-cache-mode
    - align
    - --recurrent-checkpoint-policy
    - aligned
    - --enable-prefix-caching
    - --enable-prompt-tokens-details
    - --enable-chunked-prefill
    # Decode-aware prefill scheduling: the scheduler admits prefills against
    # decode pressure with an adaptive share and half-life. Live manifest flags
    # as of the 2026-09-22 acceptance.
    - --max-parallel-prefills
    - auto
    - --prefill-compute-share
    - auto
    - --prefill-compute-half-life
    - responsive
    - --prefill-policy
    - decode-aware
    - --dtype
    - bfloat16
    - --kv-cache-dtype
    - fp8
    - --quantization
    - modelopt_mixed
    - --block-size
    - "16"
    - --load-format
    - instanttensor
    - --max-model-len
    - "1048576"
    - --max-num-seqs
    - "8"
    - --max-num-batched-tokens
    - "8192"
    - --max-cudagraph-capture-size
    - "32"
    - --gpu-memory-utilization
    - "0.76"
    - --speculative-config
    - '{"method":"mtp","num_speculative_tokens":3}'
    - --compilation-config
    - '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}'
    - --gdn-decode-kernel
    - b12x
    - --gdn-prefill-backend
    - b12x
    - --linear-backend
    - b12x
    - --moe-backend
    - b12x
    - --no-enable-flashinfer-autotune
    - --additional-config
    - '{"ple_table_memory":"ram"}'
    # ram copies the PLE n-gram tables into page-locked host memory at boot
    # (13.41 GiB per rank) instead of reading them through the io_uring
    # DiskTable on every forward pass. disk mode retired on 2026-09-22: the
    # recurring async illegal-memory-access class surfaced through its
    # synchronize point; ram is the mode accepted by live soak.
    # The checkpoint declares max_position_embeddings 262144 with rope_type
    # "default". A 4x YaRN override reaches 1,048,576 exactly. mrope_section and
    # mrope_interleaved must stay: get_rope() only preserves M-RoPE, which the
    # vision position ids need, when mrope_section is present.
    - --hf-overrides
    - '{"text_config":{"max_position_embeddings":1048576,"rope_parameters":{"rope_type":"yarn","factor":4.0,"original_max_position_embeddings":262144,"mrope_interleaved":true,"mrope_section":[11,11,10],"partial_rotary_factor":0.25,"rope_theta":10000000}}}'
    - --reasoning-parser
    - qwen3
    - --tool-call-parser
    - qwen3_xml
    - --enable-auto-tool-choice
    - --disable-access-log-for-endpoints
    - /metrics,/v1/models
  base_env:
    CUTE_DSL_ARCH: sm_121a
    # Only the V2 model runner's model state drives the PLE table prepare path
    # that hands the table to the engine (boot copy in ram mode, io_uring
    # bindings in disk mode). Without it the first forward pass raises.
    VLLM_USE_V2_MODEL_RUNNER: "1"
    # Hard requirement of this model's GDN path.
    VLLM_SSM_CONV_STATE_LAYOUT: DS
    CUDA_DEVICE_ORDER: PCI_BUS_ID
    VLLM_WORKER_MULTIPROC_METHOD: spawn
    SAFETENSORS_FAST_GPU: "1"
    # instanttensor is a stock vLLM loader, so this recipe needs no b12x
    # plugin; the live deployment leaves the allowlist empty. Set it to
    # b12x_loader only if you switch --load-format to b12x.
    VLLM_PLUGINS: ""
    # nvidia-cutlass-dsl ships a .pth to put its dsl_packages directory on
    # sys.path. RoCEnante's support check imports cutlass from there, so both
    # entries are required: the venv's site-packages and the DSL packages.
    PYTHONPATH: /opt/venv/lib/python3.12/site-packages:/opt/venv/lib/python3.12/site-packages/nvidia_cutlass_dsl/dsl_packages
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    HF_HOME: /models
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    INSTANTTENSOR_BACKEND: BUFFERED
    INSTANTTENSOR_BUFFER_SIZE: "1342177280"
    INSTANTTENSOR_CONCURRENCY: "1"
    INSTANTTENSOR_IO_DEPTH: "3"
    # b12x one-shot RoCE collectives for the cross-node TP group. Fail-stop: if
    # a rank cannot take part, the backend is disabled on every rank at init.
    VLLM_ENABLE_ROCE_ALLREDUCE: "1"
    VLLM_ROCE_ALLREDUCE_MAX_SIZE: "41943040"
    # VLLM_QWEN3_8_PREFILL_COALESCE stays unset in the accepted configuration.
    # It is opt-in and functional only from the current cycle pin, which wires
    # the prefill checkpoint blocks into the NVIDIA GDN decoder. On earlier
    # cuts that contain the coalesce feature (61f93c53ee onward), setting it
    # aborts boot with "all mamba groups must share cache scheduling parameters".
    VLLM_B12X_DENSE_ACTIVATION_MODE: a16
    # The live deployment quantizes the B12X MXFP8 activations; a16 dense
    # plus quantized MXFP8 is the accepted pair for this checkpoint.
    VLLM_B12X_MXFP8_ACTIVATION_MODE: quantized
    VLLM_SHM_BROADCAST_ADAPTIVE_MAX_GRACE_MS: "2"
    # The first-boot RoCE preparation race times out at sequence 1 with the
    # default spin budget on this topology.
    B12X_ROCE_SPIN_LIMIT: "600000000"
    PYTHONFAULTHANDLER: "1"
    # NCCL still carries collectives outside RoCEnante's size limits.
    NCCL_NET: IB
    NCCL_IB_DISABLE: "0"
    NCCL_CROSS_NIC: "1"
    NCCL_CUMEM_ENABLE: "0"
    NCCL_IGNORE_CPU_AFFINITY: "1"
    NCCL_NVLS_ENABLE: "0"
    NCCL_DEBUG: WARN
    OMP_NUM_THREADS: "2"
    VLLM_MARLIN_USE_ATOMIC_ADD: "1"
    TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
    VLLM_CACHE_ROOT: /cache/vllm
    # b12x compiles its native loader on first use and caches it under
    # XDG_CACHE_HOME. Node-local storage keeps that off the container filesystem.
    XDG_CACHE_HOME: /cache
    TRITON_CACHE_DIR: /cache/triton
    TORCHINDUCTOR_CACHE_DIR: /cache/torchinductor
    FLASHINFER_WORKSPACE_BASE: /cache/flashinfer
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
    VLLM_USE_AOT_COMPILE: "1"
    VLLM_USE_MEGA_AOT_ARTIFACT: "1"
    VLLM_ENABLE_PCIE_ALLREDUCE: "0"
deployment:
  nodes: 2
  tensor_parallel_size: 2
  model_path: /models/qwen38-flash-next
  # The checkpoint's tensor payload is about 99 GiB. In ram mode the PLE tables
  # are copied from the published safetensors once at boot, so the published
  # root must stay local and readable for load and restart rather than for
  # every forward pass.
  storage_min_free_gib: 130
  download_workers: 8
  ignore_patterns: []
  # Loaded after the weights. Naming them lets the image helper fail on a
  # truncated snapshot instead of the engine failing at model load.
  required_files:
    - tokenizer_config.json
    - chat_template.jinja
  parameters:
    namespace:
      label: Kubernetes namespace
      type: string
      required: true
      default: vllm
      targets: [lws, llm-d-routing]
      description: Namespace for the model and its routing resources.
      help: {label: Namespace and Secret setup, href: guides/deploy-tp2/#create-namespace-and-credential}
    name:
      label: Deployment name
      type: string
      required: true
      default: qwen38-flash-next
      description: DNS-compatible base name for resources and Docker containers.
      help: {label: Deployment walkthrough, href: guides/deploy-tp2/}
    model_storage_path:
      label: Model storage path
      type: string
      required: true
      default: /var/lib/models
      targets: [lws, docker]
      description: Absolute persistent host path on each GPU node for the model cache and published snapshot. The engine loads the PLE tables from these files at boot, so it must stay local and readable for every load and restart.
      help: {label: Storage layout, href: guides/deploy-tp2/#storage-paths}
    jit_storage_path:
      label: JIT cache path
      type: string
      required: true
      default: /var/cache/vllm/qwen38-flash-next
      targets: [lws, docker]
      description: Absolute persistent host path on each GPU node for compiler and kernel caches.
      help: {label: Storage layout, href: guides/deploy-tp2/#storage-paths}
    hf_secret:
      label: Hugging Face Secret
      type: string
      required: true
      default: huggingface-token
      targets: [lws]
      description: Kubernetes Secret created from the operator's local HF_TOKEN environment variable.
      help: {label: Create the Secret, href: guides/deploy-tp2/#create-namespace-and-credential}
    hf_secret_key:
      label: Hugging Face Secret key
      type: string
      required: true
      default: HF_TOKEN
      targets: [lws]
      description: Data key in the Kubernetes Secret; the browser never accepts or stores the token itself.
      help: {label: Create the Secret, href: guides/deploy-tp2/#create-namespace-and-credential}
    network_attachment:
      label: RoCE network attachment
      type: string
      required: true
      default: roce-net
      targets: [lws]
      description: Multus NetworkAttachmentDefinition name for the secondary collective network.
      help: {label: Create and inspect the attachment, href: guides/multus-rdma/#define-the-secondary-network}
    node_selector:
      label: GPU node selector
      type: stringMap
      required: true
      default: {}
      targets: [lws]
      description: Site-specific labels selecting the two GB10 nodes; arm64 is enforced separately.
      help: {label: Find node labels, href: guides/deploy-tp2/#node-placement}
    topology_key:
      label: Exclusive topology key
      type: string
      required: true
      default: ""
      targets: [lws]
      description: Site label that groups the two nodes allowed to form this TP group.
      help: {label: Configure topology labels, href: guides/deploy-tp2/#node-placement}
    topology_values:
      label: Allowed topology values
      type: string
      required: true
      default: ""
      targets: [lws]
      description: Comma-separated values accepted for the exclusive topology key.
      help: {label: Configure topology labels, href: guides/deploy-tp2/#node-placement}
    rdma_resource:
      label: RDMA extended resource
      type: string
      required: true
      default: rdma.com/roce
      targets: [lws]
      description: RDMA shared-device-plugin resource key for the selected host interfaces.
      help: {label: Configure the RDMA resource, href: guides/multus-rdma/#advertise-one-rdma-unit-per-node}
    rdma_units:
      label: RDMA allocator units
      type: integer
      required: true
      default: 1
      targets: [lws]
      description: Extended-resource allocator units per rank, not the number of HCAs or ports.
      help: {label: Inspect RDMA allocation, href: guides/multus-rdma/#advertise-one-rdma-unit-per-node}
    hca:
      label: NCCL HCA list
      type: string
      required: true
      default: rocep1s0f1,roceP2p1s0f1
      suggestions:
        - rocep1s0f1,roceP2p1s0f1
      targets: [lws, docker]
      description: Comma-separated RDMA devices. The preset is the pair used by this GB10 deployment; type over it if host enumeration differs.
      help: {label: Find HCA names, href: guides/multus-rdma/#advertise-one-rdma-unit-per-node}
    gid_index:
      label: RoCE GID index
      type: integer
      required: true
      default: 3
      targets: [lws, docker]
      description: GID index verified for the site's RoCE VLAN and address family.
      help: {label: Select the GID, href: guides/multus-rdma/#identify-the-runtime-network-values}
    control_interface:
      label: Host control network interface
      type: string
      required: true
      default: ""
      targets: [docker]
      description: Docker host interface used by Gloo coordination and NCCL socket bootstrap; Kubernetes uses the primary pod interface eth0.
      help: {label: Find host interfaces, href: guides/deploy-tp2/#runtime-network-interfaces}
    leader_ip:
      label: Leader host IP
      type: string
      required: true
      default: ""
      targets: [docker]
      description: Docker-only rank-zero address reachable from the worker over the host network.
      help: {label: Docker host networking, href: guides/deploy-tp2/#docker-host-values}
    worker_ip:
      label: Worker host IP
      type: string
      required: true
      default: ""
      targets: [docker]
      description: Docker-only rank-one address used as that rank's VLLM_HOST_IP.
      help: {label: Docker host networking, href: guides/deploy-tp2/#docker-host-values}
    gateway_class:
      label: GatewayClass name
      type: string
      required: true
      default: ""
      targets: [llm-d-routing]
      description: Routing-only accepted Envoy GatewayClass supplied by the cluster operator.
      help: {label: Install or inspect GatewayClass, href: guides/cluster-prerequisites/#install-envoy-gateway-183}
validation:
  image: ghcr.io/randomvariable/vllm-b12x-multi@sha256:429efe0798f8c91b1f21d978b4130ec0660ecb738fcbe05e083a7d504c4889c8
  lws: verified
  docker: unverified
  evidence: >-
    Accepted live on 2026-09-23/24 in the author's two-node GB10 cluster on kubeadm with Cilium,
    running the ram PLE mode, 0.76 utilization, a 32-token CUDA graph capture cap,
    VLLM_B12X_MXFP8_ACTIVATION_MODE=quantized, VLLM_PLUGINS empty, the 1,048,576-token
    max_position_embeddings override, and VLLM_QWEN3_8_PREFILL_COALESCE unset (the eager-mode
    IMA discriminator is permanently parked). The two live ranks run image
    sha256:ec8bbb3e (vLLM 88e9186daf39 plus b12x 9135f93ae533), a Harbor-published build
    that is not mirrored to this registry; the recipe args and environment above are synced
    to that live deployment. The nearest public karmic build in this registry - the digest
    cited as validation.image - is the next cycle cut, vLLM d9e52bdf4663 with the same b12x
    9135f93ae533. This PR re-pins the profile to vLLM fe8b327bcd9f plus b12x e8130f89752b
    (master-based), published to this registry by the first nightly after it reaches main.
    The decode sweep table keeps its original provenance: unprofiled, 30-second-per-cell,
    concurrency 1 to 8, contexts 0 to 128K, A16 dense activation, direct port-forward, not
    comparable to the max-seqs=4 baseline.
guide:
  hardware: Two arm64 GB10 nodes, one physical integrated GPU per node, with a working RoCE secondary network and at least 130 GiB free model storage per node for the 99 GiB checkpoint.
  fixed_tuning: TP=2, MTP depth 3, 0.76 GPU memory utilization, 1,048,576-token maximum context from a 4x YaRN override, eight sequences, 8,192 batched tokens, decode-aware prefill scheduling, FP8 KV cache, full and piecewise CUDA graphs capped at a 32-token capture size, B12X GDN prefill and decode, quantized B12X MXFP8 activations, and PLE tables in page-locked host memory. Never set CUDA_LAUNCH_BLOCKING, because b12x does not function with synchronous kernel launches.
  networking: Primary control traffic uses the operator-selected socket interfaces; tensor-parallel collectives use the selected RDMA HCAs. Kubernetes allocator units do not describe physical device counts.
  safety: Stop both ranks gracefully with a 120-second timeout. A long kernel is not grounds for force-killing a GB10 process.
