# DeepSeek V4 Flash Vision on two RoCE-joined GB10 nodes, TP=2.
#
# One file per deployment. `launch`, `docs` and `benchmark` are what
# `vllm-image launch --recipe deepseek-v4-flash-vision-gb10-tp2` reads; `meta`,
# `model`, `deployment`, `validation` and `guide` are what the
# GitHub Pages recipe renders. The recipe's name is this file's stem, which is
# also `meta.slug` and the selection string the launcher resolves.
#
# Selection: the upstream ds4-vision model profile plus our gb10-roce hardware
# profile. As with the Qwen recipe, every value the model profile or the common
# layer already sets is left out; what remains is the delta this image's
# accepted live deployment actually carries, plus the process settings that are
# ours rather than upstream's.
#
# Source of truth for every value below: the accepted live deployment's command
# and environment, which this file's `launch` section states as options and
# environment entries -- there is no second copy of the hand-written command to
# keep in step. image_tools/launcher_data_test.py compares the record the
# resolver builds from `launch` against image_tools/data/golden. The checkpoint
# revision is the one the upstream ds4-vision profile names as its
# checkpoint_revision.
meta:
  title: DeepSeek V4 Flash Vision, two-node TP=2
  slug: deepseek-v4-flash-vision-gb10-tp2
  description: A fixed two-node, one-GB10-per-node DeepSeek-V4-Flash-Vision deployment using tensor parallelism over RoCE.
model:
  model_id: deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
  revision: 6821d6ad3681a4b137b066b76094fa82ebd0a380
  served_name: deepseek-v4-flash-vision
launch:
  profile: ds4-vision
  hardware: gb10-roce
  # No preset: upstream's deployment presets all name
  # hardware: rtx-pro-6000-pcie, whose policy is a single host with a PCIe
  # crossover all-reduce. Two GB10 nodes over RoCE have neither.
  preset: null
  options:
    # The launcher publishes the fetched snapshot here, so the engine loads a
    # directory of safetensors on local NVMe rather than the repository id. The
    # profile names deepseek-ai/DeepSeek-V4-Flash-Vision-Exp for the single-node
    # case where vLLM may fetch it itself.
    model: /models/deepseek-v4-flash-vision
    # The profile serves the repository id; this deployment answers to the
    # short name the gateway and the LiteLLM modelRef use.
    served-model-name: deepseek-v4-flash-vision
    # The profile selects the MoE and attention kernels but leaves dense
    # selection to native vLLM, which stops at Marlin for MXFP8 on this device;
    # the accepted deployment names b12x for the dense projections as well. The
    # resolver warns about exactly this, so confirm DeepGEMM dispatch in the
    # serving logs of the accepted group.
    linear-backend: b12x
    port: 8888
    # 0.81, measured. The profile's 0.975 is a single-node RTX PRO figure, and
    # 0.75 cannot admit the 1M-token KV cache, which needs about 9.88 GiB. This
    # is the utilization the group was accepted on, not a rounded guess.
    gpu-memory-utilization: 0.81
    # The profile leaves the context at -1 (whatever the checkpoint declares).
    # This deployment serves the full 1,000,000 tokens.
    max-model-len: 1000000
    max-num-batched-tokens: 8192
    # The profile asks for "auto", which the resolver then sizes from the
    # verifier-row width. 16 is the accepted cap for this checkpoint, matching
    # the capture sizes below.
    max-cudagraph-capture-size: 16
    # The profile's compilation-config plus the qualified capture-size list:
    # one graph per running-request count up to the cap, so every batch shape
    # the four request slots can reach replays a graph instead of falling back
    # to piecewise execution.
    compilation-config:
      cudagraph_mode: FULL_AND_PIECEWISE
      custom_ops:
        - all
      cudagraph_capture_sizes:
        - 1
        - 2
        - 3
        - 4
        - 8
        - 12
        - 16
    # One image per prompt. The accepted deployment passes {"image":1} and no
    # video key at all.
    limit-mm-per-prompt:
      image: 1
    # No speculative-config, mode or draft-tokens here: the profile's dspark
    # mode supplies the policy at depth 3, which adds
    # rejection_sample_method to the hand-written command's
    # {"method":"dspark","num_speculative_tokens":3,"draft_sample_method":
    # "probabilistic"}.
  environment:
    # Not repeated here because another layer already sets them: the common
    # layer exports CUDA_DEVICE_ORDER, SAFETENSORS_FAST_GPU,
    # PYTORCH_CUDA_ALLOC_CONF, INSTANTTENSOR_BACKEND,
    # VLLM_WORKER_MULTIPROC_METHOD and VLLM_USE_V2_MODEL_RUNNER; the ds4-vision
    # profile exports OMP_NUM_THREADS, VLLM_B12X_MOE_FP4_FORCE_A16,
    # VLLM_USE_AOT_COMPILE, VLLM_USE_BREAKABLE_CUDAGRAPH,
    # VLLM_USE_MEGA_AOT_ARTIFACT, VLLM_USE_FLASHINFER_SAMPLER,
    # VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS and
    # VLLM_MULTI_STREAM_GEMM_TOKEN_THRESHOLD; gb10-roce sets the NCCL, RoCE,
    # spin-limit, PCIe-off and architecture list.
    #
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
    # Dense GEMMs take the split-K turbo path. The profile leaves dense
    # selection to native vLLM, so confirm DeepGEMM dispatch in the serving logs
    # of the accepted group.
    B12X_DENSE_SPLITK_TURBO: "1"
    B12X_MOE_FORCE_A8: "1"
    DG_JIT_USE_NVRTC: "0"
    # nvidia-cutlass-dsl's .pth does not take effect in this image's venv and
    # RoCEnante needs it: see docs.PYTHONPATH.
    PYTHONPATH: /opt/venv/lib/python3.12/site-packages:/opt/venv/lib/python3.12/site-packages/nvidia_cutlass_dsl/dsl_packages
    # b12x registers its weight loader through a general plugin, so the
    # allowlist names it; an empty value leaves --load-format b12x unavailable.
    VLLM_PLUGINS: b12x_loader
    # The checkpoint is fetched and published by the launcher before the engine
    # starts, so nothing here may reach the hub: see docs.HF_HUB_OFFLINE.
    HF_HOME: /models
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    # Node-local compiler/JIT scratch on persistent NVMe. b12x/loader compiles
    # its native reader with cc on first use and caches it under
    # $XDG_CACHE_HOME, so it must not sit on the container filesystem. The
    # remaining compiler-cache paths the resolver derives from XDG_CACHE_HOME
    # land on the same volume; these are spelled out because they are the
    # accepted live values.
    VLLM_CACHE_ROOT: /cache/vllm
    XDG_CACHE_HOME: /cache
    TRITON_CACHE_DIR: /cache/triton
    TORCHINDUCTOR_CACHE_DIR: /cache/torchinductor
    FLASHINFER_WORKSPACE_BASE: /cache/flashinfer
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
  topology:
    kind: lws
    nodes: 2
    # The rank-zero rendezvous socket the follower polls before exec'ing. Also
    # the --master-port the engine is given.
    rendezvous_port: 25000
    kv_events:
      # Rank zero only: the leader owns the API server and the scheduler, and
      # publishing from the headless rank would add a second, unroutable source
      # for the same blocks. The topic is built from POD_IP, the resolved
      # --port and the resolved --served-model-name by launch.kv_events_args.
      # Publisher ports are offset by data-parallel rank (DP=1 here, so
      # 5556/5559 are literal), chosen off vLLM's 5557 default.
      publisher: zmq
      endpoint: tcp://*:5556
      replay_endpoint: tcp://*:5559
    # Not a replica layout: one conversation spans both ranks, so there is no
    # per-replica port range.
    replica_port_base: null
  # The probe sidecar listens here on every rank, including the headless ones,
  # which have no HTTP server of their own.
  probe_port: 8890

# Unmanaged native arguments this deployment passes after `--`. They are not in
# runtime/options.yaml, so the resolver forwards them to vLLM without
# validating them; a recipe cannot carry them as options.
#   --distributed-executor-backend mp
#   --master-port 25000
#   --dcp-comm-backend a2a
#   --reasoning-config {"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}
#   --disable-access-log-for-endpoints /metrics,/v1/models

# Per-value explanation for the site's step 3, read alongside upstream's
# runtime/parameter-docs.yaml. Only the names upstream does not document appear
# here, and each documents a value this file itself sets.
docs:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN:
    group: memory
    summary: Permit a context longer than the checkpoint's own declared ceiling.
    why: >-
      The accepted live deployment exports this beside the 1,000,000-token
      context; upstream's ds4-vision profile leaves max-model-len at -1 and does
      not set it. Without it the engine refuses the context this recipe asks for.
  B12X_MOE_FORCE_A8:
    group: kernels
    summary: Force the b12x MoE experts onto the A8 (int8 activation) kernels.
    why: >-
      The accepted deployment runs the W4A8 expert path on this checkpoint. The
      ds4-vision profile carries only VLLM_B12X_MOE_FP4_FORCE_A16=0, which is a
      different switch, so nothing upstream selects A8 for these experts.
  DG_JIT_USE_NVRTC:
    group: kernels
    summary: Build DeepGEMM's JIT kernels without NVRTC.
    why: >-
      DeepGEMM's JIT builds with NVRTC disabled on this pin; the DSL path the
      image otherwise takes does not resolve for these shapes.
  PYTHONPATH:
    group: runtime
    summary: sys.path entries the engine's children inherit, the venv plus the CuTe DSL packages.
    why: >-
      nvidia-cutlass-dsl ships a .pth that should put its dsl_packages directory,
      which holds the cutlass package, on sys.path, and that .pth does not take
      effect in this image's venv. It is b12x.comm.roce.is_supported() that needs
      cutlass, so without this variable the RoCE all-reduce cannot decide whether
      the device supports it. Both entries are required: a PYTHONPATH carrying
      only dsl_packages hides the venv from the launcher.
  HF_HUB_OFFLINE:
    group: model
    summary: Refuse any hub request; the checkpoint is already on the node.
    why: >-
      The launcher's model-sync phase fetches, verifies and publishes the
      snapshot before the engine starts, so a request out to huggingface.co at
      load time would mean the published root was not used. The same reason
      gives TRANSFORMERS_OFFLINE its value.
  TRANSFORMERS_OFFLINE:
    group: model
    summary: Refuse any hub request from the tokenizer and processor loaders.
    why: >-
      transformers resolves tokenizer and chat-template assets independently of
      vLLM's model fetch, so offline must be asserted on both paths; the
      required_files list names them so a truncated snapshot fails in the
      launcher rather than at model load.
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS:
    group: runtime
    summary: Watchdog budget for one execute_model step, in seconds.
    why: >-
      A 1,000,000-token prefill exceeds the engine's own watchdog window; 1800 s
      is the accepted budget for one step, measured on the accepted group.
deployment:
  nodes: 2
  tensor_parallel_size: 2

  # -- cluster shape -------------------------------------------------------------
  # DeepSeek is the second tenant of the same two-node RoCE GB10 fleet and has not
  # been accepted on a group of its own yet, so its manifest shape inherits the
  # accepted GB10 TP=2 envelope the sibling Qwen recipe documents: three groups, a
  # no-surge rolling rollout, the dgx placement/taint, four GPUs with the RDMA
  # allocator, root plus IPC_LOCK, group fsGroup 0, DirectoryOrCreate hostPaths, and
  # the two-hour startup / 6x15s readiness httpGet windows with no liveness. Every
  # number traces to the live manifest the Qwen recipe cites --
  # src/rv/k8s/clusters/home/llm-d/qwen38-flash-next.yaml (groups 138, rollout
  # 142-151, nodeSelector 169-171, tolerations 191-195, requests/limits 675-689,
  # securityContext 327-332, pod fsGroup 199-200, hostPaths 754-765, probes
  # 711/715/727-732) -- and is recorded here, not invented.
  groups: 3
  restartPolicy: RecreateGroupAfterStart
  rollout:
    type: RollingUpdate
    maxUnavailable: 1
    maxSurge: 0
    partition: 0
  nodeSelector:
    kubernetes.io/arch: arm64
    node-role.kubernetes.io/dgx: ""
  tolerations:
    - key: dgx
      operator: Equal
      value: "true"
      effect: NoSchedule
  gpu: 4
  rdma: true
  resources:
    requests:
      cpu: "8"
      memory: 96Gi
      ephemeral-storage: 128Gi
    limits: {}
  securityContext:
    runAsUser: 0
    capabilities:
      add: [IPC_LOCK]
  podSecurityContext:
    fsGroup: 0
  volumes:
    hostPathType: DirectoryOrCreate
  # No livenessProbe: inherited with the rest of the accepted GB10 shape, and the
  # live group carries none (an invented window killed healthy groups before).
  probes:
    startup:
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 240
    readiness:
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 6
  # The HF cache root the launcher downloads into before it publishes; the
  # engine only ever reads `model_path`. One volume, one identity: the published
  # root is `<storage_root>/<served-model-name>`, which
  # image_tools/launcher_data_test.py asserts.
  storage_root: /models
  model_path: /models/deepseek-v4-flash-vision
  # The accepted deployment asks for 200 GiB free on each node, which is the
  # tensor payload plus the room the fetch needs to finish. Refuse to start a
  # download that cannot finish rather than filling the node's NVMe and taking
  # unrelated models down with it.
  storage_min_free_gib: 200
  download_workers: 8
  # The three trees the accepted deployment excludes: the repository ships
  # them, and the engine never reads them.
  ignore_patterns:
    - inference/*
    - encoding/*
    - .eval_results/*
  # Loaded after the weights. Naming them lets the image helper fail on a
  # truncated snapshot instead of the engine failing at model load.
  required_files:
    - tokenizer_config.json
    - chat_template.jinja
  # -- site fields ---------------------------------------------------------------
  # The same two-node RoCE shape as the sibling Qwen recipe, so the shared set in
  # `recipes-site/src/data/site-parameters.js` declares all nineteen fields -- the
  # eight every deployment asks for plus the attachment, topology key and values, RDMA
  # resource and units, HCA pair, GID index, control interface and the two rank
  # addresses -- with their labels, types and explanations, and each already carries
  # the value this fleet runs. Two defaults are this deployment's own: its resource
  # name, and the JIT cache directory named after it.
  parameters:
    name:
      default: deepseek-v4-flash-vision
    jit_storage_path:
      default: /var/cache/vllm/deepseek-v4-flash-vision
# The measured panel the recipe page renders. Every number, qualifier and "not
# measured" statement is here rather than in the page, so the site cannot show a
# figure this file does not carry. `degraded` marks the rows where the wave did
# not complete, and `primary` the column the panel emphasises.
benchmark:
  version: 0.6.2
  context:
    - Estonia profile
    - 134,240 prompt tokens
    - Benchmark v0.6.2
    - Warm starts
    - One wave per concurrency
  tables:
    - id: concurrency
      title: Warm concurrency sweep
      aria_label: DeepSeek deployment benchmark results
      columns:
        - Concurrency
        - Start time / TTFT
        - Per-request decode
        - Mean request
        - Completed
      rows:
        - cells:
            - text: "1"
            - text: "73.72"
              unit: s
              primary: true
              notes:
                - Cold prefill
                - 'Warm TTFT: 0.72 s'
            - text: "47.93"
              unit: tok/s
            - text: "83.88"
              unit: s
            - text: 1 / 1
        - cells:
            - text: "2"
            - text: "1.33"
              unit: s
            - text: "39.61"
              unit: tok/s
            - text: "107.78"
              unit: s
            - text: 2 / 2
        - cells:
            - text: "4"
            - text: "1.76"
              unit: s
            - text: "26.56"
              unit: tok/s
            - text: "99.15"
              unit: s
            - text: 4 / 4
        - cells:
            - text: "8"
            - text: "53.07"
              unit: s
            - text: "26.17"
              unit: tok/s
            - text: "168.75"
              unit: s
            - text: 8 / 8
        - cells:
            - text: "16"
            - text: "251.78"
              unit: s
            - text: "22.39"
              unit: tok/s
            - text: "415.30"
              unit: s
            - text: 16 / 16
        - degraded: true
          cells:
            - text: "30"
            - text: "281.51"
              unit: s
            - text: "22.91"
              unit: tok/s
            - text: "404.02"
              unit: s
            - text: 21 / 30
        - degraded: true
          cells:
            - text: "48"
            - text: "253.56"
              unit: s
            - text: "22.93"
              unit: tok/s
            - text: "421.60"
              unit: s
            - text: 17 / 48
        - degraded: true
          cells:
            - text: "64"
            - text: "242.58"
              unit: s
            - text: "22.69"
              unit: tok/s
            - text: "353.98"
              unit: s
            - text: 24 / 64
  notes:
    - title: Cold prefill
      body: >-
        The earlier concurrency-one run processed the 134,240-token prompt in
        73.72 seconds at 1,821 tokens/s. Its three subsequent requests used the
        warm prefix cache and averaged 0.94 seconds TTFT.
    - title: Warm concurrency sweep
      body: >-
        The identical 707,468-character prompt had already been processed before
        every result in the table. Every completed request passed. Per-request
        decode slowed as concurrency increased. The TTFT cliff began at
        concurrency 8. Concurrency 16 was the largest complete batch; at 30 and
        above, every incomplete request stalled before its first token.
    - body: >-
        The benchmark reports this decode value as `aggregate_gen_tok_s`,
        calculated as total generated tokens divided by the sum of each completed
        request's generation duration. Concurrent intervals overlap, so this is a
        duration-weighted per-request rate, not total server throughput.
    - body: >-
        The later scout completed in 0.67 seconds because it hit the warm prefix
        cache. Its apparent 200,114 tokens/s is not physical prefill throughput.
        This is a one-wave warm-start concurrency characterization, not a stable
        statistical performance baseline.
validation:
  image: ghcr.io/randomvariable/vllm-b12x-multi@sha256:42d5d72bd79a371c3b5a756fe2a1814f3c9393dd9a73d65bcefa01eb8f28d726
  # Two GB10 nodes over RoCE as one LeaderWorkerSet, which is what the live
  # deployment runs and what `launch.topology` selects.
  kubernetes: verified
  docker: unverified
  evidence: Accepted live on 2026-09-14 in the author's non-k3s kubeadm/Cilium two-node GB10 cluster; this records functional deployment acceptance, not an independently measured benchmark.
guide:
  hardware: Two arm64 GB10 nodes, one physical integrated GPU per node, with a working RoCE secondary network and at least 200 GiB free model storage per node.
  fixed_tuning: TP=2, DSpark depth 3, 0.81 GPU memory utilization, 1,000,000-token maximum context, four sequences, 8,192 batched tokens, graph cap 16.
  networking: Primary control traffic uses the operator-selected socket interfaces; tensor-parallel collectives use the selected RDMA HCAs. Kubernetes allocator units do not describe physical device counts.
  safety: Stop both ranks gracefully with a 120-second timeout. A long kernel is not grounds for force-killing a GB10 process.
