<figcaption class="notes"><section class="note"><h2>Host ownership is deliberate</h2><p>The custom <code>nvidia-open</code> module, userspace driver, GSP firmware, and container toolkit stay on each GPU host. GPU Operator must not install a second driver or toolkit.</p></section><section class="note"><h2>Readiness is cumulative</h2><p>A visible GPU is not enough. The lane requires matching 64 KiB headers, loaded module versions, a real CUDA allocation and synchronization, runtime discovery, and an allocatable resource.</p></section></figcaption>
