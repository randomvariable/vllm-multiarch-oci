<figcaption class="notes"><section class="note"><h2>Component responsibilities</h2><p><code>LeaderWorkerSet</code> creates the distributed model group. Inference Extension supplies pool semantics and EPP. Envoy Gateway and Envoy AI Gateway accept and forward requests.</p></section><section class="note"><h2>Installation order</h2><p>Install CRDs before controllers, wait for controller deployments and accepted classes, then create the model and routing resources. A CRD existing alone is not controller readiness.</p></section></figcaption>
