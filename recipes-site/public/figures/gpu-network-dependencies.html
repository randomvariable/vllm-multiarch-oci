</defs>

<text x="48" y="84" fill="#252b32" font-family="'Instrument Serif',serif" font-size="28">Primary networking first. RDMA is a separate attachment.</text>

<figcaption class="notes"><section class="note"><h2>Two interfaces, two responsibilities</h2><p><code>eth0</code> remains the Cilium-managed primary interface for API, DNS, and control traffic. Multus attaches <code>net1</code> for the non-overlapping RoCE subnet.</p></section><section class="note"><h2>Policy boundaries do not transfer</h2><p>Cilium policy does not automatically secure macvlan traffic. Namespace isolation, host and fabric controls, and explicit validation must cover the plaintext secondary path.</p></section></figcaption>
