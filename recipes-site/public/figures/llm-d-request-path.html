<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>llm-d request path</title>
  <style>
    :root{--paper:#faf7f2;--paper-2:#f1ece4;--ink:#252b32;--muted:#56616b;--soft:#6d747b;--rule:rgba(37,43,50,.16);--rule-solid:#c8c2b8;--accent:#a94e2b;--accent-tint:rgba(169,78,43,.08);--link:#285f82}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}body{font-family:"Geist",sans-serif}main{width:100%;padding:24px;overflow:hidden}.figure{width:min(100%,1280px);margin:0 auto}.diagram-scroll{width:100%;overflow-x:auto;overscroll-behavior-x:contain;border:1px solid var(--rule);border-radius:8px;background:var(--paper)}.schematic{display:block;width:100%;min-width:960px;height:auto}.notes{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-top:16px}.note{padding:16px 20px;border:1px solid var(--rule);border-radius:8px;background:#fff}.note:nth-child(2){background:var(--paper-2)}.note h2{margin:0 0 8px;font:400 24px/1.1 "Instrument Serif",serif}.note p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}.note code{color:var(--ink);font:500 12px "Geist Mono",monospace}footer{display:flex;justify-content:space-between;gap:16px;margin-top:16px;padding-top:12px;border-top:1px solid var(--rule);color:var(--soft);font:400 11px/1.5 "Geist Mono",monospace}footer a{color:var(--link)}@media(max-width:700px){main{padding:12px}.notes{grid-template-columns:1fr}.note{padding:14px 16px}footer{display:block}.diagram-scroll{border-radius:6px}}
  </style>
</head>
<body>
<main>

          <symbol id="llmd-request-pod-icon" viewBox="0 0 20 20"><path fill="#326ce5" d="M10 1.4 17.6 5l1.9 8.1-5.2 6.4H5.7L.5 13.1 2.4 5z"/><path fill="#fff" d="m5.9 7.1 4.1-1.2 4.1 1.2-4.1 1.2zm0 .5 3.8 1.1v5.2l-3.8-2.1zm8.2 0v4.2l-3.8 2.1V8.7z"/></symbol>
        </defs>
        <rect width="1280" height="720" fill="#faf7f2"/>
        <text x="48" y="44" fill="#a94e2b" font-family="'Geist Mono',monospace" font-size="8" font-weight="600" letter-spacing=".16em">ARCHITECTURE / GATEWAY API INFERENCE EXTENSION</text>
        <text x="48" y="84" fill="#252b32" font-family="'Geist',sans-serif" font-size="28" font-weight="650">Inference request and endpoint-selection paths</text>
        <text x="48" y="112" fill="#56616b" font-family="'Geist',sans-serif" font-size="12">LWS manages the model group; EPP selects an eligible rank-zero endpoint.</text>

        <rect x="280" y="160" width="912" height="416" rx="8" fill="rgba(37,43,50,.02)" stroke="rgba(37,43,50,.16)"/>
        <rect x="296" y="156" width="148" height="16" rx="2" fill="#faf7f2"/>

        <rect x="244" y="260" width="80" height="12" rx="2" fill="#faf7f2"/>

        <path d="M 640 256 H 568 Q 560 256 560 264 V 304 Q 560 312 552 312 H 488" fill="none" stroke="#56616b" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#llmd-request-arrow)"/>

        <path d="M 408 332 V 376 Q 408 384 416 384 H 792 Q 800 384 800 392 V 416" fill="none" stroke="#285f82" stroke-width="2" marker-end="url(#llmd-request-arrow-link)"/>
        <rect x="568" y="360" width="136" height="12" rx="2" fill="#faf7f2"/>
        <text x="636" y="368" fill="#285f82" font-family="'Geist Mono',monospace" font-size="8" font-weight="600" text-anchor="middle">INFERENCE PAYLOAD</text>

        <path d="M 800 416 V 352 Q 800 344 792 344 H 744 Q 736 344 736 336 V 304" fill="none" stroke="#56616b" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#llmd-request-arrow)"/>
        <rect x="748" y="320" width="104" height="12" rx="2" fill="#faf7f2"/>
        <text x="800" y="328" fill="#56616b" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">METRICS :9002</text>

        <path d="M 928 452 H 1000" fill="none" stroke="#a94e2b" stroke-width="2" marker-end="url(#llmd-request-arrow-accent)"/>
        <path d="M 1000 476 H 928" fill="none" stroke="#a94e2b" stroke-width="2" marker-end="url(#llmd-request-arrow-accent)"/>
        <rect x="932" y="440" width="64" height="12" rx="2" fill="#faf7f2"/>
        <text x="964" y="448" fill="#a94e2b" font-family="'Geist Mono',monospace" font-size="8" font-weight="600" text-anchor="middle">TP=2</text>

        <!-- Client -->
        <rect x="48" y="240" width="192" height="92" rx="6" fill="#fff" stroke="#252b32"/>
        <rect x="60" y="252" width="48" height="16" rx="2" fill="none" stroke="rgba(37,43,50,.40)"/>
        <text x="84" y="264" fill="#56616b" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">CLIENT</text>
        <text x="144" y="288" fill="#252b32" font-family="'Geist',sans-serif" font-size="12" font-weight="600" text-anchor="middle">OpenAI client</text>
        <text x="144" y="308" fill="#56616b" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">x-ai-eg-model header</text>

        <!-- Gateway -->
        <rect x="328" y="232" width="160" height="100" rx="6" fill="rgba(169,78,43,.08)" stroke="#a94e2b" stroke-width="2"/>
        <use href="#llmd-request-envoy-mark" x="344" y="248" width="36" height="36"/>
        <rect x="392" y="244" width="64" height="16" rx="2" fill="none" stroke="rgba(169,78,43,.52)"/>
        <text x="424" y="256" fill="#a94e2b" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">GATEWAY</text>
        <text x="408" y="288" fill="#252b32" font-family="'Geist',sans-serif" font-size="12" font-weight="600" text-anchor="middle">Envoy AI Gateway</text>
        <text x="408" y="308" fill="#56616b" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">Gateway + AIGatewayRoute</text>

        <!-- EPP -->
        <rect x="640" y="176" width="192" height="128" rx="6" fill="#fff" stroke="#252b32"/>
        <rect x="652" y="188" width="32" height="16" rx="2" fill="none" stroke="rgba(37,43,50,.40)"/>
        <text x="668" y="200" fill="#56616b" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">EPP</text>
        <text x="736" y="224" fill="#252b32" font-family="'Geist',sans-serif" font-size="12" font-weight="600" text-anchor="middle">Endpoint picker</text>
        <text x="736" y="244" fill="#56616b" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">queue 2 / KV 2 / prefix 3</text>

        <text x="736" y="284" fill="#6d747b" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">payload never enters EPP</text>

        <!-- Pool -->
        <rect x="896" y="192" width="248" height="96" rx="6" fill="#fff" stroke="#252b32"/>
        <rect x="908" y="204" width="96" height="16" rx="2" fill="none" stroke="rgba(37,43,50,.40)"/>
        <text x="956" y="216" fill="#56616b" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">INFERENCEPOOL</text>

        <text x="1020" y="264" fill="#56616b" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">selector: worker-index=0</text>

        <text x="864" y="224" fill="#56616b" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">WATCH</text>

        <rect x="672" y="416" width="256" height="112" rx="6" fill="#fff" stroke="#252b32"/>
        <use href="#llmd-request-pod-icon" x="688" y="436" width="32" height="32"/>
        <rect x="732" y="428" width="32" height="16" rx="2" fill="none" stroke="rgba(37,43,50,.40)"/>
        <text x="748" y="440" fill="#56616b" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">POD</text>
        <text x="800" y="468" fill="#252b32" font-family="'Geist',sans-serif" font-size="12" font-weight="600" text-anchor="middle">vLLM rank 0</text>
        <text x="800" y="488" fill="#56616b" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">API :8888 / selected endpoint</text>
        <text x="800" y="508" fill="#6d747b" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">LeaderWorkerSet member</text>

        <!-- Rank 1 -->
        <rect x="1000" y="416" width="144" height="112" rx="6" fill="#f1ece4" stroke="#56616b"/>
        <use href="#llmd-request-pod-icon" x="1016" y="436" width="32" height="32"/>
        <rect x="1060" y="428" width="32" height="16" rx="2" fill="none" stroke="rgba(37,43,50,.40)"/>
        <text x="1076" y="440" fill="#56616b" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">POD</text>
        <text x="1072" y="468" fill="#252b32" font-family="'Geist',sans-serif" font-size="12" font-weight="600" text-anchor="middle">vLLM rank 1</text>
        <text x="1072" y="488" fill="#56616b" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">headless</text>
        <text x="1072" y="508" fill="#6d747b" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">never pooled</text>

        <!-- Debug service -->
        <rect x="352" y="456" width="200" height="72" rx="6" fill="rgba(37,43,50,.02)" stroke="rgba(37,43,50,.24)" stroke-dasharray="4 4"/>
        <use href="#llmd-request-service-icon" x="368" y="476" width="32" height="32"/>
        <text x="452" y="484" fill="#252b32" font-family="'Geist',sans-serif" font-size="12" font-weight="600" text-anchor="middle">Debug Service</text>
        <text x="452" y="504" fill="#56616b" font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle">bypasses scheduled routing</text>
        <path d="M 552 492 H 608 Q 616 492 616 484 V 480 Q 616 472 624 472 H 672" fill="none" stroke="#56616b" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#llmd-request-arrow)"/>

        <line x1="48" y1="616" x2="1232" y2="616" stroke="rgba(37,43,50,.16)"/>
        <text x="48" y="644" fill="#6d747b" font-family="'Geist Mono',monospace" font-size="8" letter-spacing=".14em">LEGEND</text>

        <line x1="352" y1="640" x2="392" y2="640" stroke="#56616b" stroke-dasharray="5 4" marker-end="url(#llmd-request-arrow)"/>
        <text x="404" y="644" fill="#56616b" font-family="'Geist Mono',monospace" font-size="8">CONTROL / METRICS</text>
        <line x1="596" y1="640" x2="636" y2="640" stroke="#a94e2b" stroke-width="2" marker-start="url(#llmd-request-arrow-accent)" marker-end="url(#llmd-request-arrow-accent)"/>
        <text x="648" y="644" fill="#56616b" font-family="'Geist Mono',monospace" font-size="8">GPU COLLECTIVE</text>
      </svg>
    </div>
    <figcaption class="notes">
      <section class="note"><h2>Endpoint selection is out of band</h2><p>The Gateway asks EPP over gRPC. EPP scores endpoints represented by the <code>InferencePool</code> and returns a choice; it does not proxy the image or text payload.</p></section>
      <section class="note"><h2>One TP group means one choice</h2><p>Only rank zero is eligible. With a single two-rank group, prefix-aware scoring has no second replica to choose; rank one contributes compute through collectives.</p></section>
    </figcaption>
    <footer><span>LWS is orchestration, not the router.</span><span>Icons: CNCF Envoy artwork and Kubernetes Community resources (Apache-2.0); geometry embedded and sanitized.</span></footer>
  </figure>
</main>
