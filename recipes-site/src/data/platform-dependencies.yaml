status:
  reference_date: "2026-09-14"
  production_evidence: "The recipe image and TP=2 LeaderWorkerSet were accepted live on a non-k3s kubeadm/Cilium cluster on 2026-09-14."
  k3s_lane: "Documented from released upstream artifacts; not end-to-end validated on GB10 k3s."

dependencies:
  - id: dgx-os
    name: DGX OS / Ubuntu
    version: "24.04"
    source: https://docs.nvidia.com/dgx/dgx-os-7-user-guide/index.html
    owner: host operator
    depends_on: []
    readiness: "test $(dpkg --print-architecture) = arm64"
    tested: true
    notes: "Worked host lane only; use repositories already configured by DGX OS."
  - id: kernel
    name: NVIDIA 64 KiB-page kernel and headers
    version: "7.0.0-1016-nvidia-64k"
    source: https://packages.ubuntu.com/
    owner: host operator
    depends_on: [dgx-os]
    readiness: "uname -r; getconf PAGESIZE; test -r /lib/modules/$(uname -r)/build/Makefile"
    tested: true
    notes: "Package availability is host-repository dependent; stop rather than substitute another ABI."
  - id: nvidia-driver
    name: NVIDIA open kernel modules fork
    version: "615.71.09 (spark-615.71.09-1, c5296e2d92f2cdb23cd10df25ec6e989b5f96c42)"
    source: https://github.com/randomvariable/open-gpu-kernel-modules/tree/c5296e2d92f2cdb23cd10df25ec6e989b5f96c42
    owner: host operator / DKMS nvidia-open
    depends_on: [kernel]
    readiness: "modinfo -F version nvidia; nvidia-smi"
    tested: true
    notes: "Kernel source, userspace, and GSP firmware must all be 615.71.09; distro package pin was 615.71.09-1ubuntu1."
  - id: container-toolkit
    name: NVIDIA Container Toolkit
    version: "1.17.8-1"
    source: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html
    owner: host operator
    depends_on: [nvidia-driver]
    readiness: "command -v nvidia-container-runtime"
    tested: true
    notes: "Install before k3s; k3s discovers the runtime from its service PATH."
  - id: k3s
    name: k3s / Kubernetes
    version: "v1.34.6+k3s1"
    source: https://github.com/k3s-io/k3s/releases/tag/v1.34.6%2Bk3s1
    owner: cluster operator
    depends_on: [container-toolkit]
    readiness: "kubectl get nodes -o wide"
    tested: false
    notes: "Released arm64 artifact; selected Kubernetes 1.34 is in Cilium 1.19's tested matrix and Network Operator 26.7 minimum range."
  - id: gateway-api
    name: Kubernetes Gateway API CRDs
    version: "v1.5.0"
    source: https://github.com/kubernetes-sigs/gateway-api/releases/tag/v1.5.0
    owner: cluster operator
    depends_on: [k3s]
    readiness: "kubectl get crd gateways.gateway.networking.k8s.io httproutes.gateway.networking.k8s.io"
    tested: true
    notes: "Install standard and experimental channel CRDs required by the inference stack before controller CRDs."
  - id: cilium
    name: Cilium
    version: "1.19.4"
    source: https://github.com/cilium/cilium/releases/tag/v1.19.4
    owner: cluster operator / primary CNI
    depends_on: [k3s]
    readiness: "cilium status --wait; cilium connectivity test"
    tested: false
    notes: "Primary pod network and policy only; does not automatically secure the Multus secondary interface."
  - id: coredns
    name: CoreDNS
    version: "bundled with v1.34.6+k3s1"
    source: https://docs.k3s.io/networking/networking-services
    owner: k3s
    depends_on: [cilium]
    readiness: "kubectl -n kube-system rollout status deployment/coredns"
    tested: false
  - id: nfd
    name: Node Feature Discovery
    version: "bundled by GPU Operator 26.7.0"
    source: https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/getting-started.html
    owner: GPU Operator (fresh lane only)
    depends_on: [coredns]
    readiness: "kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{\" \"}{.metadata.labels.feature\\.node\\.kubernetes\\.io/pci-10de\\.present}{\"\\n\"}{end}'"
    tested: false
    notes: "Exactly one NFD owner. Existing clusters with NFD disable gpu-operator nfd.enabled."
  - id: gpu-operator
    name: NVIDIA GPU Operator
    version: "26.7.0"
    source: https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/release-notes.html
    owner: GPU Operator
    depends_on: [nfd, container-toolkit]
    readiness: "kubectl -n gpu-operator get pods; kubectl get node -o custom-columns=NAME:.metadata.name,GPU:.status.allocatable.nvidia\\.com/gpu"
    tested: false
    notes: "Host owns driver and toolkit; driver.enabled=false and toolkit.enabled=false."
  - id: multus
    name: Multus thick plugin
    version: "v4.2.2"
    source: https://github.com/k8snetworkplumbingwg/multus-cni/releases/tag/v4.2.2
    owner: cluster operator / secondary CNI multiplexer
    depends_on: [cilium]
    readiness: "kubectl -n kube-system rollout status daemonset/kube-multus-ds"
    tested: false
  - id: macvlan
    name: CNI macvlan plugin
    version: "bundled CNI plugins in v1.34.6+k3s1"
    source: https://www.cni.dev/plugins/current/main/macvlan/
    owner: k3s CNI bundle
    depends_on: [multus]
    readiness: "test -x /var/lib/rancher/k3s/data/cni/macvlan"
    tested: false
  - id: whereabouts
    name: Whereabouts IPAM
    version: "v0.9.2"
    source: https://github.com/k8snetworkplumbingwg/whereabouts/releases/tag/v0.9.2
    owner: cluster operator
    depends_on: [multus]
    readiness: "kubectl -n kube-system rollout status daemonset/whereabouts"
    tested: false
  - id: network-operator
    name: NVIDIA Network Operator / RDMA shared device plugin
    version: "26.7.0"
    source: https://docs.nvidia.com/networking/display/kubernetes2670/release-notes.html
    owner: Network Operator (allocator only)
    depends_on: [nfd, multus]
    readiness: "kubectl get nicclusterpolicy nic-cluster-policy; kubectl get nodes -o custom-columns=NAME:.metadata.name,RDMA:.status.allocatable.rdma\\.com/roce"
    tested: false
    notes: "OFED, NFD, Multus, SR-IOV and CNI management remain disabled; inbox mlx5 stays host-owned."
  - id: cert-manager
    name: cert-manager
    version: "v1.21.2"
    source: https://cert-manager.io/docs/installation/helm/
    owner: cluster operator
    depends_on: [coredns]
    readiness: "kubectl -n cert-manager wait --for=condition=Available deployment --all --timeout=5m"
    tested: false
  - id: lws
    name: LeaderWorkerSet
    version: "v0.10.0"
    source: https://github.com/kubernetes-sigs/lws/releases/tag/v0.10.0
    owner: LWS controller
    depends_on: [cert-manager]
    readiness: "kubectl -n lws-system wait --for=condition=Available deployment --all --timeout=5m"
    tested: true
    notes: "Production evidence is kubeadm/Cilium, not k3s. LWS orchestrates pod groups; it is not a scheduler."
  - id: inference-extension
    name: Gateway API Inference Extension CRDs / EPP
    version: "v1.5.0"
    source: https://github.com/kubernetes-sigs/gateway-api-inference-extension/releases/tag/v1.5.0
    owner: cluster operator / per-model EPP
    depends_on: [coredns, gateway-api]
    readiness: "kubectl get crd inferencepools.inference.networking.k8s.io"
    tested: true
  - id: envoy-gateway
    name: Envoy Gateway
    version: "1.8.3"
    source: https://github.com/envoyproxy/gateway/releases/tag/v1.8.3
    owner: Envoy Gateway controller
    depends_on: [cert-manager, inference-extension]
    readiness: "kubectl -n envoy-gateway-system wait --for=condition=Available deployment --all --timeout=5m"
    tested: true
  - id: envoy-ai-gateway
    name: Envoy AI Gateway
    version: "v1.1.0"
    source: https://github.com/envoyproxy/ai-gateway/releases/tag/v1.1.0
    owner: Envoy AI Gateway controller
    depends_on: [envoy-gateway, cert-manager]
    readiness: "kubectl -n envoy-ai-gateway-system wait --for=condition=Available deployment --all --timeout=5m"
    tested: true
  - id: model
    name: DeepSeek-V4-Flash-Vision-Exp snapshot
    version: "6821d6ad3681a4b137b066b76094fa82ebd0a380"
    source: https://huggingface.co/deepseek-ai/DeepSeek-V4-Flash-Vision-Exp/tree/6821d6ad3681a4b137b066b76094fa82ebd0a380
    owner: vllm-image model-sync / host storage
    depends_on: [gpu-operator]
    readiness: "test -r /models/DeepSeek-V4-Flash-Vision-Exp/config.json"
    tested: true
    notes: "Requires a local Hugging Face token Secret and at least 200 GiB free at the model storage root."
  - id: model-storage
    name: Persistent node-local model and JIT storage
    version: "operator-provisioned absolute host paths; 200 GiB minimum free for model storage"
    source: https://kubernetes.io/docs/concepts/storage/volumes/#hostpath
    owner: host and cluster operator
    depends_on: [model]
    readiness: "test -d \"$MODEL_STORAGE_PATH\" -a -d \"$JIT_STORAGE_PATH\"; test \"$(df --output=avail -BG \"$MODEL_STORAGE_PATH\" | tail -1 | tr -dc '0-9')\" -ge 200"
    tested: true
    notes: "Each rank uses persistent /models and /cache mounts; topology constrains node-local data placement."
