---
# Release lane: pushing an annotated v<YYYYMMDD>.<N> tag at main builds that
# commit, runs the image contract on both architectures, and only then makes
# the release statement in the registry and on GitHub. A build or contract
# failure leaves the tag in place and creates nothing, so the tag records the
# request and a green run is what turns it into a release.
#
# The cluster-side CronJob invokes the nightly; nothing here needs a schedule.
# GitHub suppresses tag webhook deliveries when more than three tags are pushed
# at once, so push releases in batches of three or fewer.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: vllmb12x-release
  annotations:
    # A push event carries the ref in target_branch, so a tag push is matched by
    # its name. The pattern is the release tag grammar the promotion step
    # enforces, so a tag nobody meant as a release never spends the build pool.
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push"
      && target_branch.matches("^refs/tags/v[0-9]{8}\\.[0-9]+$")
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    # cancel-in-progress is deliberately absent, unlike the nightly and the
    # pull-request lane: two release tags are two releases, and a newer tag must
    # not cancel the build of one someone has already asked for. They serialise
    # on the build Lease instead, which is what protects the shared workers.
    pipelinesascode.tekton.dev/task: "git-clone"
spec:
  timeouts:
    pipeline: 8h0m0s
  params:
    - {name: repo_url, value: "{{ repo_url }}"}
    - {name: revision, value: "{{ revision }}"}
    - {name: release_tag, value: "{{ git_tag }}"}
    - {name: remote_cache, value: "{{ bazel_remote_cache }}"}
    - {name: remote_executor, value: "{{ bazel_remote_executor }}"}
    - {name: image_repository, value: "{{ image_repository }}"}
    - {name: publisher_lease, value: "{{ publisher_lease }}"}
    - {name: publisher_namespace, value: "{{ publisher_namespace }}"}
    - {name: publisher_token_secret, value: "{{ publisher_token_secret }}"}
    - {name: build_lease, value: "{{ build_lease }}"}
  taskRunTemplate:
    serviceAccountName: "{{ service_account }}"
    podTemplate:
      nodeSelector:
        # Same pinning as the nightly: architecture alone lands this run on a
        # control-plane node and starves the arm64 member beside etcd.
        kubernetes.io/arch: arm64
        kubernetes.io/hostname: "{{ build_node }}"
      imagePullSecrets: [{name: "{{ pull_secret }}"}]
      securityContext: {fsGroup: 65532}
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          storageClassName: "{{ storage_class }}"
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: "{{ workspace_size }}"
  pipelineSpec:
    params:
      - {name: repo_url, type: string}
      - {name: revision, type: string}
      - {name: release_tag, type: string}
      - {name: remote_cache, type: string}
      - {name: remote_executor, type: string}
      - {name: image_repository, type: string}
      - {name: publisher_lease, type: string}
      - {name: publisher_namespace, type: string}
      - {name: publisher_token_secret, type: string}
      - {name: build_lease, type: string}
    workspaces:
      - name: source
    tasks:
      # Frees earlier finished runs' 256Gi staging claims before this run's
      # claim is scheduled; the Task and its RBAC live with the ci manifests.
      - name: release-staging
        # PAC inlines named taskRefs from the repo or hub; a resolver
        # reference is left for Tekton to fetch from the ci namespace.
        taskRef:
          resolver: cluster
          params:
            - {name: kind, value: task}
            - {name: name, value: vllmb12x-release-staging}
            - {name: namespace, value: ci}
        params:
          - {name: current, value: $(context.pipelineRun.name)}
      - name: clone
        runAfter: [release-staging]
        taskRef:
          name: git-clone
        params:
          - {name: url, value: $(params.repo_url)}
          # The webhook resolved the tag to its commit, so this checks out
          # exactly what was tagged and nothing that landed on main afterwards.
          - {name: revision, value: $(params.revision)}
          - {name: depth, value: "1"}
          - {name: deleteExisting, value: "true"}
          - {name: subdirectory, value: checkout}
        workspaces:
          - {name: output, workspace: source}
      - name: build-test-and-release
        runAfter: [clone]
        timeout: 8h0m0s
        workspaces:
          - {name: source, workspace: source}
        taskSpec:
          params:
            - {name: revision, type: string}
            - {name: release_tag, type: string}
            - {name: remote_cache, type: string}
            - {name: remote_executor, type: string}
            - {name: image_repository, type: string}
            - {name: publisher_lease, type: string}
            - {name: publisher_namespace, type: string}
            - {name: publisher_token_secret, type: string}
            - {name: build_lease, type: string}
          workspaces:
            - name: source
          results:
            - name: image_ref
            - name: publication_tag
          steps:
            - name: build-test-and-release
              # gcr.io/bazel-public/bazel publishes amd64 only, and this run is
              # pinned to the arm64 build node, so the tools are bootstrapped
              # onto a plain Ubuntu base instead.
              image: docker.io/library/ubuntu@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b
              workingDir: $(workspaces.source.path)/checkout
              securityContext: {runAsUser: 0, runAsGroup: 0}
              env:
                - {name: HOME, value: $(workspaces.source.path)/.build-home}
                - {name: TMPDIR, value: $(workspaces.source.path)/.build-home/tmp}
                - {name: DOCKER_CONFIG, value: /tekton/docker}
                - {name: GITHUB_TOKEN_FILE, value: /var/run/vllmb12x/github/token}
                - {name: LANE, value: release}
                - {name: IMAGE_REPOSITORY, value: $(params.image_repository)}
                - {name: PUBLISHER_LEASE, value: $(params.publisher_lease)}
                - {name: PUBLISHER_NAMESPACE, value: $(params.publisher_namespace)}
                - {name: REMOTE_CACHE, value: $(params.remote_cache)}
                - {name: REMOTE_EXECUTOR, value: $(params.remote_executor)}
                - {name: RESULT, value: $(workspaces.source.path)/.build-home/publish-result.json}
              computeResources:
                requests: {cpu: "4", memory: 8Gi}
                limits: {memory: 24Gi}
              script: |
                #!/usr/bin/env bash
                set -euo pipefail
                mkdir -p "$HOME" "$TMPDIR"
                source scripts/ci/bootstrap-arm64-tools.sh
                git config --global --add safe.directory "$PWD"
                # The registry login and the release both read the mounted
                # publisher token, and neither needs it in the environment of
                # the build or of crane: pass it to the one command that asks.
                bash scripts/ci/login-ghcr.sh
                BUILD_REVISION="$(git rev-parse HEAD)"
                # One build at a time across every lane: they share this node,
                # the remote worker pool, and the ccache volume.
                python3 scripts/build-mutex.py \
                  --name "$(params.build_lease)" \
                  --namespace "$(params.publisher_namespace)" \
                  --holder "release-$(params.release_tag)-$BUILD_REVISION" \
                  -- bash scripts/ci/vllmb12x-build-and-publish.sh
                # The promotion runs only after this line: a build or contract
                # failure exits above and leaves no release tag and no release.
                REF="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["reference"])' "$RESULT")"
                PUB="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["tag"])' "$RESULT")"
                GH_TOKEN="$(cat "$GITHUB_TOKEN_FILE")" python3 scripts/release-vllmb12x.py \
                  --reference "$REF" \
                  --publication-tag "$PUB" \
                  --tag "$(params.release_tag)" \
                  --expected-revision "$(params.revision)" \
                  --tag-exists
                printf '%s' "$REF" > "$(results.image_ref.path)"
                printf '%s' "$PUB" > "$(results.publication_tag.path)"
              volumeMounts:
                - {name: github-token, mountPath: /var/run/vllmb12x/github, readOnly: true}
          volumes:
            - name: github-token
              secret:
                secretName: $(params.publisher_token_secret)
                items: [{key: token, path: token}]
        params:
          - {name: revision, value: $(params.revision)}
          - {name: release_tag, value: $(params.release_tag)}
          - {name: remote_cache, value: $(params.remote_cache)}
          - {name: remote_executor, value: $(params.remote_executor)}
          - {name: image_repository, value: $(params.image_repository)}
          - {name: publisher_lease, value: $(params.publisher_lease)}
          - {name: publisher_namespace, value: $(params.publisher_namespace)}
          - {name: publisher_token_secret, value: $(params.publisher_token_secret)}
          - {name: build_lease, value: $(params.build_lease)}
