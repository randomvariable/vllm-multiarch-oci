---
# Pull-request build of the same image the nightly publishes, pushed to the
# internal registry under a tag derived from the pull request and its two
# revisions. It never writes to the public registry and never moves `latest`,
# so a proposed change can be deployed and tested before it reaches main.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: vllmb12x-pull-request
  annotations:
    # Same exclusion as the nightly: the ARM64 build pool is not spent on
    # commits that only change the website, prose, or recipe definitions.
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "pull_request"
      && target_branch == "main"
      && !files.all.all(path,
        path.matches('^recipes-site/')
        || path.matches('^docs/')
        || path.matches('^recipes/')
        || path.matches('(^|/)README\\.md$')
        || path == '.github/workflows/recipes-pages.yaml')
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    # A new commit on the pull request supersedes the build of the old one.
    # Without this the superseded run keeps holding the build Lease, and the
    # new one waits hours behind work whose result nobody wants.
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/task: "git-clone"
spec:
  timeouts:
    pipeline: 8h0m0s
  params:
    - {name: repo_url, value: "{{ repo_url }}"}
    - {name: revision, value: "{{ revision }}"}
    - {name: pull_request, value: "{{ pull_request_number }}"}
    - {name: remote_cache, value: "{{ bazel_remote_cache }}"}
    - {name: remote_executor, value: "{{ bazel_remote_executor }}"}
    - {name: image_repository, value: "{{ pull_request_image_repository }}"}
    - {name: push_secret, value: "{{ pull_request_push_secret }}"}
    - {name: build_lease, value: "{{ build_lease }}"}
    - {name: build_lease_namespace, value: "{{ publisher_namespace }}"}
  taskRunTemplate:
    serviceAccountName: "{{ service_account }}"
    podTemplate:
      nodeSelector:
        kubernetes.io/arch: arm64
        kubernetes.io/hostname: "{{ build_node }}"
      imagePullSecrets: [{name: "{{ pull_secret }}"}]
      securityContext: {fsGroup: 65532}
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          storageClassName: "{{ storage_class }}"
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 20Gi
  pipelineSpec:
    params:
      - {name: repo_url, type: string}
      - {name: revision, type: string}
      - {name: pull_request, type: string}
      - {name: remote_cache, type: string}
      - {name: remote_executor, type: string}
      - {name: image_repository, type: string}
      - {name: push_secret, type: string}
      - {name: build_lease, type: string}
      - {name: build_lease_namespace, type: string}
    workspaces:
      - name: source
    tasks:
      - name: clone
        taskRef:
          name: git-clone
        params:
          - {name: url, value: $(params.repo_url)}
          - {name: revision, value: $(params.revision)}
          - {name: depth, value: "1"}
          - {name: deleteExisting, value: "true"}
        workspaces:
          - {name: output, workspace: source}
      - name: build-test-and-push
        runAfter: [clone]
        timeout: 8h0m0s
        workspaces:
          - {name: source, workspace: source}
        taskSpec:
          params:
            - {name: pull_request, type: string}
            - {name: remote_cache, type: string}
            - {name: remote_executor, type: string}
            - {name: image_repository, type: string}
            - {name: push_secret, type: string}
            - {name: build_lease, type: string}
            - {name: build_lease_namespace, type: string}
          workspaces:
            - name: source
          results:
            - name: image_ref
          steps:
            - name: build-test-and-push
              image: docker.io/library/ubuntu@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b
              workingDir: $(workspaces.source.path)
              securityContext: {runAsUser: 0, runAsGroup: 0}
              env:
                - {name: HOME, value: /tekton/home}
                # The registry credential is mounted ready to use, so this lane
                # never handles a token in the step itself.
                - {name: DOCKER_CONFIG, value: /var/run/vllmb12x/registry}
                - {name: PULL_REQUEST, value: $(params.pull_request)}
                - {name: IMAGE_REPOSITORY, value: $(params.image_repository)}
                - {name: REMOTE_CACHE, value: $(params.remote_cache)}
              computeResources:
                requests: {cpu: "4", memory: 8Gi}
                limits: {memory: 24Gi}
              script: |
                #!/usr/bin/env bash
                set -euo pipefail

                apt-get update
                apt-get install --no-install-recommends --yes \
                  build-essential ca-certificates curl git patch python3 unzip zip
                rm -rf /var/lib/apt/lists/*
                BAZELISK=/usr/local/bin/bazel
                curl --fail --silent --show-error --location \
                  https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-arm64 \
                  --output "$BAZELISK"
                printf '%s  %s\n' \
                  e20e8b0f4f240091b7a55bf17b9398bd4f40ee70ae0208dff95dd4c445fb4010 \
                  "$BAZELISK" | sha256sum --check --status
                chmod 0755 "$BAZELISK"
                RUSTUP_HOME=/opt/rustup
                CARGO_HOME=/opt/cargo
                export RUSTUP_HOME CARGO_HOME PATH="${CARGO_HOME}/bin:${PATH}"
                curl --fail --silent --show-error --location https://sh.rustup.rs | \
                  sh -s -- -y --profile minimal --default-toolchain 1.95.0
                KUBECTL_VERSION="$(curl --fail --silent --show-error --location https://dl.k8s.io/release/stable.txt)"
                curl --fail --silent --show-error --location \
                  "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/arm64/kubectl" \
                  --output /usr/local/bin/kubectl
                chmod 0755 /usr/local/bin/kubectl
                CRANE_ARCHIVE="${HOME}/go-containerregistry_Linux_arm64.tar.gz"
                curl --fail --silent --show-error --location \
                  https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_arm64.tar.gz \
                  --output "$CRANE_ARCHIVE"
                printf '%s  %s\n' \
                  898c0cff975f898a33e8c4580bdafb0e7c02c7faa33374e946762f97c4ab7110 \
                  "$CRANE_ARCHIVE" | sha256sum --check --status
                tar --extract --gzip --file "$CRANE_ARCHIVE" --directory /usr/local/bin crane
                chmod 0755 /usr/local/bin/crane
                crane version

                git config --global --add safe.directory "$PWD"
                BUILD_REVISION="$(git rev-parse HEAD)"
                cat > .bazelrc.user <<EOF
                build --remote_cache=$(params.remote_cache)
                build --remote_timeout=21600
                build --remote_cache_compression
                build --remote_upload_local_results=true
                build:remote-aarch64 --remote_executor=$(params.remote_executor)
                build:remote-x86_64 --remote_executor=$(params.remote_executor)
                build:remote-multiarch --remote_executor=$(params.remote_executor)
                EOF

                RESULT="${HOME}/publish-result.json"
                export BUILD_REVISION RESULT
                cat > "${HOME}/build-test-and-push.sh" <<'SCRIPT'
                #!/usr/bin/env bash
                set -euo pipefail
                # Local strategy: these are host Python tests, and the remote
                # ARM64 worker image carries no python3 interpreter.
                bazel test //scripts:all --disk_cache= --test_output=errors
                export VLLMB12X_CACHE_ROOT=/ccache
                bazel build //image:vllmb12x --config=remote-multiarch --disk_cache= --//platforms:vllmb12x_cache_root="$VLLMB12X_CACHE_ROOT"
                # The rule defaults to --test-report $XML_OUTPUT_FILE --output junit, which
                # sends every per-test line to a file that dies with the pod. Clearing the
                # report and forcing text keeps container-structure-test's === RUN / --- FAIL
                # detail in test.log, where --test_output=errors surfaces it in the TaskRun.
                bazel test //tests/image:vllmb12x_contract --config=remote-aarch64 --disk_cache= --//platforms:vllmb12x_cache_root="$VLLMB12X_CACHE_ROOT" --test_output=errors --test_arg=--test-report= --test_arg=--output --test_arg=text
                bazel test //tests/image:vllmb12x_contract --config=remote-x86_64 --disk_cache= --//platforms:vllmb12x_cache_root="$VLLMB12X_CACHE_ROOT" --test_output=errors --test_arg=--test-report= --test_arg=--output --test_arg=text
                python3 scripts/publish-vllmb12x.py \
                  --repository "$IMAGE_REPOSITORY" \
                  --build-revision "$BUILD_REVISION" \
                  --pull-request "$PULL_REQUEST" \
                  --bazel-arg=--config=remote-multiarch \
                  --bazel-arg=--//platforms:vllmb12x_cache_root="$VLLMB12X_CACHE_ROOT" \
                  --bazel-arg=--remote_cache="$REMOTE_CACHE" \
                  --bazel-arg=--disk_cache= \
                  --result-file "$RESULT"
                SCRIPT
                # One build at a time across both lanes: they share this node,
                # the remote worker pool, and the ccache volume.
                python3 scripts/build-mutex.py \
                  --name "$(params.build_lease)" \
                  --namespace "$(params.build_lease_namespace)" \
                  --holder "pull-request-$PULL_REQUEST-$BUILD_REVISION" \
                  -- bash "${HOME}/build-test-and-push.sh"
                REF="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["reference"])' "$RESULT")"
                printf '%s' "$REF" > "$(results.image_ref.path)"
              volumeMounts:
                - {name: registry-credentials, mountPath: /var/run/vllmb12x/registry, readOnly: true}
          volumes:
            - name: registry-credentials
              secret:
                secretName: $(params.push_secret)
                items: [{key: .dockerconfigjson, path: config.json}]
        params:
          - {name: pull_request, value: $(params.pull_request)}
          - {name: remote_cache, value: $(params.remote_cache)}
          - {name: remote_executor, value: $(params.remote_executor)}
          - {name: image_repository, value: $(params.image_repository)}
          - {name: push_secret, value: $(params.push_secret)}
          - {name: build_lease, value: $(params.build_lease)}
          - {name: build_lease_namespace, value: $(params.build_lease_namespace)}
